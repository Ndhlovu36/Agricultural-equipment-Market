<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agri Equipment Market</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<style>
body{margin:0;background:#0a2a12;color:#fff;font-family:Arial}
.header{background:#0f4d1a;padding:15px;text-align:center;border-bottom:3px solid #2ecc71}
.mode{display:flex;justify-content:center;gap:10px;padding:10px}
.mode button{padding:10px 20px;border-radius:25px;border:2px solid #2ecc71;background:#0a2a12;color:#fff;font-weight:bold}
.mode button.active{background:#2ecc71;color:#000}
.banner{background:gold;color:#000;text-align:center;padding:8px;font-weight:bold}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}
.card{background:#123d1a;border-radius:12px;overflow:hidden;border:2px solid #1e6b2a}
.card img{width:100%;height:160px;object-fit:cover}
.card.info{padding:8px;text-align:center}
.card.name{font-weight:bold;font-size:13px}
.card.price{color:#2ecc71;font-weight:bold}
.card.net{color:gold;font-size:12px;font-weight:bold}
.btn{width:90%;margin:5px 5%;padding:10px;background:#2ecc71;border:none;border-radius:8px;font-weight:bold}
.float{position:fixed;bottom:15px;padding:12px 18px;border-radius:25px;font-weight:bold;border:none;z-index:99}
.del{left:15px;background:orange}
.sale{right:15px;background:#2ecc71;color:#fff}
</style>
</head>
<body>
<div class="header">
<h2 style="margin:0">🚜 Agri Equipment Market</h2>
<div id="modeText">TESTNET - Test Pi</div>
</div>
<div class="mode">
<button id="mBtn" onclick="setMode('mainnet')">🟢 MAINNET</button>
<button id="tBtn" class="active" onclick="setMode('testnet')">🟡 TESTNET</button>
</div>
<div class="banner" id="banner">Mode: TESTNET - Test Pi only (Pi Browser Testnet)</div>

<div class="grid" id="grid"></div>

<button class="float del" onclick="openWA('Delivery')">🚚 Delivery</button>
<button class="float sale" onclick="openWA('Sales')">💬 Sales</button>

<div id="detail" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:#000;z-index:100;padding:15px;overflow:auto">
<img id="dImg" style="width:100%;border-radius:12px">
<h3 id="dName"></h3>
<h2 id="dPrice"></h2>
<div id="dMode"></div>
<input id="da" placeholder="Delivery Address" style="width:100%;padding:10px;margin:5px 0">
<input id="to" placeholder="Town" style="width:100%;padding:10px;margin:5px 0">
<input id="ph" placeholder="Phone +27..." style="width:100%;padding:10px;margin:5px 0">
<button id="pb" onclick="pay()" style="width:100%;padding:15px;background:#2ecc71;border:none;border-radius:10px;font-weight:bold;margin-top:10px">Pay with Pi</button>
<button id="ps" onclick="detail.style.display='none'" style="width:100%;padding:10px;background:#333;color:#fff;border:none;border-radius:10px;margin-top:5px">Close</button>
<div id="msg" style="margin-top:10px;color:gold"></div>
</div>

<script>
let currentMode='testnet';
let cur=null;
let products=[];
const Pi = window.Pi;
Pi.init({version:"2.0",sandbox:true});

function setMode(m){
 currentMode=m;
 document.getElementById('mBtn').classList.toggle('active',m=='mainnet');
 document.getElementById('tBtn').classList.toggle('active',m=='testnet');
 document.getElementById('modeText').innerText = m=='mainnet'?'MAINNET - Real Pi':'TESTNET - Test Pi';
 document.getElementById('banner').innerText = m=='mainnet'?'Mode: MAINNET - Real Pi payments':'Mode: TESTNET - Test Pi only (Pi Browser Testnet)';
 Pi.init({version:"2.0",sandbox:m=='testnet'});
 render();
}

const names=["16 0169","16 2077","16 2079","16 2080","16 2081","16 2082","16 2083","16 2084","16 2085","16 2086","16 2087","16 2088","16 2089","16 2090","16 2091","16 2092","16 2093","16 2094","16 2095","16 2096","16 2097","16 2098","16 2099","16 2100"];
const imgs=[
"https://images.unsplash.com/photo-1592985684811-6c0f98adb014?w=400",
"https://images.unsplash.com/photo-1624467188653-6dafa0428f0c?w=400",
"https://images.unsplash.com/photo-1500382017468-9049fed747ef?w=400",
"https://images.unsplash.com/photo-1589923188900-85dae523342b?w=400"
];

for(let i=0;i<24;i++){
 products.push({name:names[i],price:8+i,img:imgs[i%imgs.length]});
}

function render(){
 document.getElementById('grid').innerHTML=products.map((p,i)=>`
  <div class="card">
   <img src="${p.img}" onclick="openD(${i})">
   <div class="info">
    <div class="name">${p.name}</div>
    <div class="price">${p.price} Pi</div>
    <div class="net">${currentMode.toUpperCase()}</div>
   </div>
   <button class="btn" onclick="openD(${i})">Buy Now</button>
  </div>
 `).join('');
}

function openD(i){
 cur=products[i];
 document.getElementById('dImg').src=cur.img;
 document.getElementById('dName').innerText=cur.name;
 document.getElementById('dPrice').innerText=cur.price+' Pi - '+currentMode.toUpperCase();
 document.getElementById('dMode').innerText='Mode: '+currentMode.toUpperCase();
 document.getElementById('detail').style.display='block';
}

function openWA(t){
 let ph=document.getElementById('ph')?.value||'';
 let ad=document.getElementById('da')?.value||'';
 let town=document.getElementById('to')?.value||'';
 let txt=`REQUEST%0A${t}%0AProduct: ${cur?cur.name:'General'}%0APrice: ${cur?cur.price:'-'} Pi%0AAddr: ${ad}%0ATown: ${town}%0APhone: ${ph}`;
 window.open('https://wa.me/27700000000?text='+txt,'_blank');
}

async function pay(){
 if(!cur)return;
 const pb=document.getElementById('pb');
 const ps=document.getElementById('msg');
 try{
  pb.innerText='Connecting...';
  // FIX 1: Login first
  const auth = await Pi.authenticate(['username','payments'], onIncompletePayment);
  // FIX 2: Payment with no expiry issue - server must approve quickly
  const payment = await Pi.createPayment({
   amount: cur.price,
   memo: cur.name+' - Agri Market',
   metadata:{name:cur.name,addr:document.getElementById('da').value,town:document.getElementById('to').value,phone:document.getElementById('ph').value,mode:currentMode}
  },{
   onReadyForServerApproval: async (pid)=>{
    ps.innerText='Approving...';
    // Your backend must approve in 30 sec - call /api/approve
    await fetch('/api/approve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paymentId:pid})});
   },
   onReadyForServerCompletion: async (pid,txid)=>{
    ps.innerText='Completing...';
    await fetch('/api/complete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paymentId:pid,txid:txid})});
    pb.innerText='Paid ✓';
    ps.innerText='Payment success! Opening WhatsApp...';
    setTimeout(()=>openWA('Order Paid - '+cur.name),1500);
   },
   onCancel: ()=>{pb.innerText='Pay with Pi'; ps.innerText='Cancelled';},
   onError: (e)=>{pb.innerText='Try Again'; ps.innerText='Error: '+e.message;}
  });
 }catch(e){
  pb.innerText='Pay with Pi';
  ps.innerText='Open in Pi Browser. Error: '+e.message;
 }
}

function onIncompletePayment(pay){
 // FIX 3: Handle expired/incomplete payments - don't block new payment
 console.log('Incomplete',pay);
 fetch('/api/complete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paymentId:pay.identifier})});
}

render();
</script>
</body>
</html>
