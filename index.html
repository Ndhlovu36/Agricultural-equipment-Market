<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agri Market Pi</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<style>
body{margin:0;background:#0a2a12;color:#fff;font:14px Arial}
.top{display:flex;justify-content:space-between;padding:10px;background:#123d1a}
.tabs{display:flex;gap:6px;padding:8px;justify-content:center}
.tab{padding:6px 14px;border-radius:20px;background:#1a4d23;border:1px solid #2ecc71}
.tab.active{background:#2ecc71;color:#000;font-weight:bold}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px}
.card{background:#123d1a;border-radius:10px;overflow:hidden;text-align:center}
.card img{width:100%;height:140px;object-fit:cover}
.pi{color:#2ecc71;font-weight:bold}
button{width:90%;margin:6px;background:#2ecc71;border:0;border-radius:6px;padding:8px;font-weight:bold}
input{width:90%;padding:8px;margin:6px;border-radius:6px;border:0}
</style>
</head>
<body>

<div class="top">
<div id="user">Not logged</div>
<button onclick="login()" style="width:auto">Login with Pi</button>
</div>

<div class="tabs">
<div class="tab active" id="tMain" onclick="setNet(false)">Mainnet</div>
<div class="tab" id="tTest" onclick="setNet(true)">Testnet</div>
</div>

<div style="text-align:center">
<input id="email" placeholder="Your email for delivery">
</div>

<h3 style="text-align:center">24 Machines - Pi Only</h3>
<div class="grid" id="grid"></div>

<script>
let isTestnet=false;
Pi.init({version:"2.0",sandbox:false});

function setNet(test){
isTestnet=test;
Pi.init({version:"2.0",sandbox:test});
document.getElementById("tMain").className=test?"tab":"tab active";
document.getElementById("tTest").className=test?"tab active":"tab";
alert(test?"Testnet mode":"Mainnet mode");
}

function login(){
Pi.authenticate(["username","payments"],(p)=>{}).then(a=>{
document.getElementById("user").innerText="Hi "+a.user.username;
localStorage.setItem("pi_user",a.user.username);
});
}

const machines=[
["16 0169",21,"IMG-20260916-WA0000.jpg"],
["16 2077",8,"IMG-20260916-WA0001.jpg"],
["16 2079",7,"IMG-20260916-WA0002.jpg"],
["16 2080",11,"IMG-20260916-WA0003.jpg"],
["16 2081",12,"IMG-20260916-WA0004.jpg"],
["16 2082",15,"IMG-20260916-WA0005.jpg"],
["16 2083",18,"IMG-20260917-WA0000.jpg"],
["16 2084",22,"IMG-20260917-WA0001.jpg"],
["16 2085",9,"IMG-20260920-WA0000.jpg"],
["16 2086",14,"IMG-20260920-WA0001.jpg"],
["16 2087",16,"IMG-20260920-WA0002.jpg"],
["16 2088",19,"IMG-20260920-WA0003.jpg"],
["16 2089",13,"IMG-20260920-WA0004.jpg"],
["16 2090",10,"IMG-20260921-WA0000.jpg"],
["16 2091",17,"IMG-20260921-WA0001.jpg"],
["16 2092",20,"IMG-20260916-WA0000.jpg"],
["16 2093",23,"IMG-20260916-WA0001.jpg"],
["16 2094",24,"IMG-20260916-WA0002.jpg"],
["16 2095",25,"IMG-20260916-WA0003.jpg"],
["16 2096",26,"IMG-20260916-WA0004.jpg"],
["16 2097",27,"IMG-20260916-WA0005.jpg"],
["16 2098",28,"IMG-20260917-WA0000.jpg"],
["16 2099",29,"IMG-20260917-WA0001.jpg"],
["16 2100",30,"IMG-20260920-WA0000.jpg"]
];

let h="";
for(let m of machines){
h+=`<div class=card><img src="${m[2]}"><div>${m[0]}</div><div class=pi>${m[1]} Pi</div><input id="em${m[0]}" placeholder="email" style="display:none"><button onclick="buy(${m[1]},'${m[0]}')">Buy ${m[1]} Pi</button></div>`;
}
grid.innerHTML=h;

function buy(amount,memo){
let email=document.getElementById("email").value;
if(!email){alert("Add email first");return;}
Pi.authenticate(["username","payments"]).then(()=>{
Pi.createPayment({amount:amount,memo:memo+" email:"+email},{})
});
}
</script>
</body>
</html>
