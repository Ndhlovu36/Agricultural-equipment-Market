<!DOCTYPE html>
<html><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agri Market Pi - 14 Heavy</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f1f5eb;padding-bottom:160px}
.header{background:#2e7d32;color:#fff;padding:12px;text-align:center;position:sticky;top:0;z-index:999}
.switch{display:flex;justify-content:center;gap:10px;margin:8px 0}
.switch button{padding:7px 18px;border-radius:20px;border:2px solid #fff;background:transparent;color:#fff;font-weight:bold;font-size:13px}
.switch button.active{background:#fff;color:#2e7d32}
.actions{display:flex;gap:8px;justify-content:center;margin:8px 0}
.btn-top{padding:9px 14px;border-radius:10px;border:none;font-weight:bold;font-size:13px}
.login{background:#ff9800;color:#fff}.wa{background:#25D366;color:#fff}
.grid{padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 3px 8px rgba(0,0,0,.12)}
.card img{width:100%;height:125px;object-fit:cover}
.body{padding:8px}
.name{font-size:10px;font-weight:bold;height:28px;overflow:hidden}
.price{color:#2e7d32;font-weight:bold;font-size:13px}
.btn{width:100%;padding:9px;background:#2e7d32;color:#fff;border:none;border-radius:8px;margin-top:4px;font-weight:bold;font-size:12px}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.7);z-index:9999;justify-content:center;align-items:center;padding:12px}
.box{background:#fff;width:100%;max-width:360px;border-radius:14px;padding:16px}
.box input,.box textarea{width:100%;padding:10px;margin:5px 0;border-radius:8px;border:1px solid #ccc}
</style>
</head>
<body>
<div class="header">
<h2 style="margin:0;font-size:17px">🚜 Agri Market - Pi (14 Items)</h2>
<div id="user" style="font-size:12px">❌ Not logged in</div>
<div class="switch">
<button id="btn-test" class="active" onclick="setMode('testnet')">Testnet</button>
<button id="btn-main" onclick="setMode('mainnet')">Mainnet</button>
</div>
<div class="actions">
<button class="btn-top login" onclick="piLogin()">🔐 Login with Pi</button>
<a href="https://wa.me/27700000000" target="_blank"><button class="btn-top wa">WhatsApp</button></a>
</div>
</div>
<div class="grid" id="grid"></div>
<div class="modal" id="modal"><div class="box">
<img id="m-img" src="" style="width:100%;height:140px;object-fit:cover;border-radius:10px">
<h3 id="m-name" style="font-size:14px"></h3><div id="m-price" class="price"></div>
<input id="d-name" placeholder="Full Name *"><input id="d-phone" placeholder="Phone *">
<textarea id="d-address" rows="2" placeholder="Delivery Address *"></textarea>
<button class="btn" onclick="confirmPay()">✅ Pay with Pi</button>
<button class="btn" style="background:#999" onclick="closeModal()">Cancel</button>
</div></div>
<script>
let piUser=null,currentMode='testnet',currentProduct=null;
Pi.init({version:"2.0",sandbox:true});
function setMode(m){
 currentMode=m;
 document.getElementById('btn-test').classList.toggle('active',m==='testnet');
 document.getElementById('btn-main').classList.toggle('active',m==='mainnet');
 Pi.init({version:"2.0",sandbox:m==='testnet'});
 piUser=null;
 document.getElementById('user').innerText="Switched to "+m+" - Login again";
}
function piLogin(){Pi.authenticate(['username','payments'],()=>{}).then(a=>{piUser=a.user;document.getElementById('user').innerText="✅ "+a.user.username+" ("+currentMode+")";}).catch(e=>alert(e.message));}

const products=[
{name:"KUBOTA PRO 6000",price:2.5,image:"IMG-20260916-WA0169.jpg"},
{name:"JD X9 1100 Combine",price:8.9,image:"IMG-20260916-WA3079.jpg"},
{name:"JD 4120R Sprayer 120ft",price:4.2,image:"IMG-20260916-WA2077.jpg"},
{name:"CLAAS LEXION 8700",price:6.5,image:"IMG-20260920-WA7092.jpg"},
{name:"CASE 4540 Floater",price:3.8,image:"IMG-20260920-WA5226.jpg"},
{name:"JD 8R 410 + Disc",price:3.2,image:"IMG-20260920-WA3637.jpg"},
{name:"JD 8R Tillage",price:2.8,image:"IMG-20260917-WA4818.jpg"},
{name:"JD DB120 Planter",price:3.5,image:"IMG-20260920-WA4385.jpg"},
{name:"Kubota XTA Sprayer",price:1.8,image:"IMG-20260920-WA1709.jpg"},
{name:"JD 9RX 640 640HP Track",price:12,image:"IMG-20260921-WA4395.jpg"},
{name:"New Holland CR11 775HP",price:11,image:"IMG-20260921-WA0033.jpg"},
{name:"Fendt 1050 Vario 517HP",price:9.5,image:"IMG-20260921-WA1772.jpg"},
{name:"CAT Challenger MT875",price:8.5,image:"IMG-20260921-WA0256.jpg"},
{name:"Case IH Quadtrac 715 715HP",price:12,image:"IMG-20260921-WA2164.jpg"}
];

const grid=document.getElementById('grid');
products.forEach(p=>{
 grid.innerHTML+=`<div class="card"><img src="./${p.image}"><div class="body"><div class="name">${p.name}</div><div class="price">π ${p.price}</div><button class="btn" onclick="openModal('${p.name}',${p.price},'${p.image}')">Buy with Pi</button></div></div>`;
});
function openModal(n,p,i){if(!piUser){piLogin();return;}currentProduct={name:n,price:p,img:i};document.getElementById('m-name').innerText=n;document.getElementById('m-price').innerText="Price: π "+p+" ("+currentMode+")";document.getElementById('m-img').src="./"+i;document.getElementById('modal').style.display='flex';}
function closeModal(){document.getElementById('modal').style.display='none';}
function confirmPay(){
 const name=document.getElementById('d-name').value,phone=document.getElementById('d-phone').value,addr=document.getElementById('d-address').value;
 if(!name||!phone||!addr){alert("Fill all");return;}
 closeModal();
 Pi.createPayment({amount:parseFloat(currentProduct.price),memo:currentProduct.name,metadata:{addr:addr,realPrice:currentProduct.price}},{
   onReadyForServerApproval:()=>{},
   onReadyForServerCompletion:(id,txid)=>{alert("✅ SUCCESS! π "+currentProduct.price+" ("+currentMode+")\nTx: "+txid); window.open("https://wa.me/27700000000?text=ORDER "+encodeURIComponent(currentProduct.name)+" Pi "+currentProduct.price+" ("+currentMode+")%0AName "+encodeURIComponent(name)+"%0APhone "+encodeURIComponent(phone)+"%0AAddr "+encodeURIComponent(addr),"_blank");},
   onCancel:()=>alert("Cancelled"),onError:(e)=>alert("Error: "+JSON.stringify(e))
 });
}
</script>
</body>
</html>
