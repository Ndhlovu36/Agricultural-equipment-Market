<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial;background:#f1f5eb;padding-bottom:120px}
.header{background:#2e7d32;color:#fff;padding:14px;text-align:center;position:sticky;top:0;z-index:1000;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.switch{display:flex;justify-content:center;gap:12px;margin:10px 0}
.switch button{padding:8px 20px;border-radius:25px;border:2px solid #fff;background:transparent;color:#fff;font-weight:bold;cursor:pointer}
.switch button.active{background:#fff;color:#2e7d32}
.top-actions{display:flex;gap:10px;justify-content:center;margin-top:8px}
.btn-top{padding:10px 16px;border:none;border-radius:10px;font-weight:bold;cursor:pointer;font-size:14px}
.login{background:#ff9800;color:#fff}
.wa{background:#25D366;color:#fff}
.grid{padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 4px 10px rgba(0,0,0,.12)}
.card img{width:100%;height:130px;object-fit:cover;background:#e0e0e0}
.info{padding:10px}
.name{font-size:11px;font-weight:bold;height:34px;line-height:1.2;overflow:hidden}
.price{color:#2e7d32;font-weight:bold;margin:4px 0;font-size:14px}
.btn-buy{width:100%;padding:10px;background:#2e7d32;color:#fff;border:none;border-radius:10px;font-weight:bold;cursor:pointer}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:2000;justify-content:center;align-items:center;padding:15px}
.box{background:#fff;width:100%;max-width:380px;border-radius:16px;padding:18px;max-height:90vh;overflow:auto}
.box img{width:100%;height:150px;object-fit:cover;border-radius:12px;margin-bottom:8px}
.box input,.box textarea{width:100%;padding:11px;margin:6px 0;border:1px solid #ccc;border-radius:10px;font-size:14px}
</style>
</head>
<body>
<div class="header">
<h2 style="font-size:18px">🚜 Agri Market Pi - 24 MACHINES</h2>
<div id="user" style="font-size:13px;margin:6px 0">❌ Not logged in</div>
<div class="switch">
<button id="btn-test" class="active" onclick="setMode('testnet')">Testnet</button>
<button id="btn-main" onclick="setMode('mainnet')">Mainnet</button>
</div>
<div class="top-actions">
<button class="btn-top login" onclick="piLogin()">🔐 Login with Pi</button>
<a href="https://wa.me/27700000000" target="_blank"><button class="btn-top wa">WhatsApp</button></a>
</div>
</div>

<div class="grid" id="grid"></div>

<div class="modal" id="modal">
<div class="box">
<img id="m-img" src="">
<h3 id="m-name" style="font-size:15px;margin-bottom:4px"></h3>
<div id="m-price" style="color:#2e7d32;font-weight:bold;margin-bottom:10px"></div>
<input id="d-name" placeholder="Full Name *">
<input id="d-phone" placeholder="Phone Number *">
<textarea id="d-address" rows="3" placeholder="Full Delivery Address *"></textarea>
<button class="btn-buy" style="margin-top:8px" onclick="confirmPay()">✅ Pay with Pi</button>
<button class="btn-buy" style="background:#999;margin-top:8px" onclick="closeModal()">Cancel</button>
</div>
</div>

<script>
let piUser=null,currentMode='testnet',currentProduct=null;
Pi.init({version:"2.0",sandbox:true});

function setMode(m){
 currentMode=m;
 document.getElementById('btn-test').classList.toggle('active',m==='testnet');
 document.getElementById('btn-main').classList.toggle('active',m==='mainnet');
 Pi.init({version:"2.0",sandbox:m==='testnet'});
 piUser=null;
 document.getElementById('user').innerText="Switched to "+m.toUpperCase()+" - Please login again";
}

function piLogin(){
 Pi.authenticate(['username','payments'], onIncompletePaymentFound).then(auth=>{
  piUser=auth.user;
  document.getElementById('user').innerText="✅ "+auth.user.username+" ("+currentMode+")";
 }).catch(e=>{ alert("Login failed: "+(e.message||e)); });
}
function onIncompletePaymentFound(payment){ console.log("Incomplete",payment); }
