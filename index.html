<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gauteng Shopping Hub - Pay with Pi</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<style>
body{font-family:Arial;background:#f5f5f5;margin:0;padding:15px}
.card{background:#fff;padding:15px;margin:10px 0;border-radius:10px;box-shadow:0 2px 8px #0001}
button{background:#7c3aed;color:#fff;border:0;padding:12px 20px;border-radius:8px;font-weight:bold;width:100%;margin-top:10px}
button:disabled{background:#ccc}
input{width:100%;padding:10px;margin:5px 0;border:1px solid #ddd;border-radius:6px;box-sizing:border-box}
.top{display:flex;justify-content:space-between;align-items:center}
.pi-badge{background:#7c3aed;color:#fff;padding:5px 10px;border-radius:20px;font-size:12px}
</style>
</head>
<body>
<div class="top">
<h2>Gauteng Shopping Hub</h2>
<div><span id="user">Not logged</span> <button onclick="login()" style="width:auto">Login with Pi</button></div>
</div>

<div class="card">
<h3>Delivery Address</h3>
<input id="addr" placeholder="Street, Suburb, Gauteng">
<input id="phone" placeholder="WhatsApp Number">
</div>

<div id="shops"></div>

<script>
const Pi = window.Pi;
Pi.init({version:"2.0", sandbox:false}); // MAINNET

let piUser=null;
let accessToken=null;

const BUSINESSES=[
 {id:"groceries",name:"Gauteng Groceries",price:2,memo:"Grocery Pack"},
 {id:"marble",name:"Marble Floors South Africa",price:1,memo:"Marble Floors Service"},
 {id:"realestate",name:"Gauteng Real Estate",price:5,memo:"Property Viewing Fee"},
 {id:"fashion",name:"Fashion Hub",price:2,memo:"Fashion Order"},
 {id:"electronics",name:"Electronics",price:3,memo:"Electronics Order"},
 {id:"food",name:"Fast Food",price:1,memo:"Food Order"},
];

function render(){
 let h='';
 BUSINESSES.forEach(b=>{
   h+=`<div class="card">
   <b>${b.name}</b> <span class="pi-badge">${b.price} Pi</span>
   <p>${b.memo}</p>
   <button onclick="buy('${b.id}',${b.price},'${b.memo}')">Pay ${b.price} Pi with Pi</button>
   </div>`;
 });
 document.getElementById('shops').innerHTML=h;
}
render();

async function login(){
 try{
   const auth = await Pi.authenticate(['username','payments'], onIncomplete);
   piUser=auth.user;
   accessToken=auth.accessToken;
   document.getElementById('user').innerText='@'+piUser.username;
   alert('Logged in as '+piUser.username);
 }catch(e){ alert('Login failed: '+e.message); }
}

function onIncomplete(payment){
 console.log('Incomplete payment found',payment);
 completePaymentFlow(payment.identifier, payment.transaction.txid);
}

async function buy(id,amount,memo){
 if(!piUser) return alert('Login with Pi first');
 const addr=document.getElementById('addr').value;
 if(!addr) return alert('Enter delivery address');
 if(!amount || amount<=0) return alert('Invalid amount');

 const paymentData={
   amount: amount,
   memo: memo.substring(0,100),
   metadata: {businessId:id, address:addr, phone:document.getElementById('phone').value, username: piUser.username}
 };

 try{
   const payment = await Pi.createPayment(paymentData, {
     onReadyForServerApproval: async (paymentId)=>{
       console.log('Approving',paymentId);
       const r=await fetch('/api/approve-payment',{
         method:'POST',
         headers:{'Content-Type':'application/json'},
         body:JSON.stringify({paymentId:paymentId})
       });
       const j=await r.json();
       console.log('approve-payment response',j);
       if(!j.ok) console.error('Approve failed',j);
     },
     onReadyForServerCompletion: async (paymentId,txid)=>{
       console.log('Completing',paymentId,txid);
       const r=await fetch('/api/complete-payment',{
         method:'POST',
         headers:{'Content-Type':'application/json'},
         body:JSON.stringify({paymentId:paymentId, txid:txid})
       });
       const j=await r.json();
       console.log('complete-payment response',j);
       alert('Payment SUCCESS! '+amount+' Pi for '+memo+'\nTx: '+txid);
     },
     onCancel: (paymentId)=>{ console.log('Cancelled',paymentId); alert('Payment cancelled'); },
     onError: (err,payment)=>{ console.error('Pi Error',err,payment); alert('Payment error: '+err.message); }
   });
 }catch(e){ alert('Pay failed: '+e.message); }
}

async function completePaymentFlow(paymentId,txid){
 await fetch('/api/complete-payment',{
   method:'POST',
   headers:{'Content-Type':'application/json'},
   body:JSON.stringify({paymentId,txid})
 });
}
</script>
</body>
</html>
