<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AGRI Pi MARKET</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<style>
 body{margin:0;background:#f2f4f8;color:#111;font-family:sans-serif}
 .top{background:#fff;padding:10px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #0a1931}
 .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}
 .card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.15)}
 .img{height:110px;background:#ddd;display:flex;align-items:center;justify-content:center;font-size:40px;background-size:cover;background-position:center}
 .badge{font-size:10px;padding:2px 7px;border-radius:8px;color:#fff;display:inline-block;margin:6px}
 .b-PLANTER{background:#6f42c1}.b-FERT{background:#8B4513}.b-SPRAYER{background:#198754}.b-PLOUGH{background:#0d6efd}.b-HARVEST{background:#ff8c00}
 .name{padding:6px 8px;font-size:12px;font-weight:bold;min-height:32px}
 .price{padding:0 8px 8px;color:#0a58ca;font-weight:bold}
 .cart{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);background:#0a1931;color:#fff;padding:12px 24px;border-radius:28px;border:2px solid #ffcc00}
</style>
</head>
<body>
<div class="top"><b>AGRI Pi MARKET<br><span style="color:#ffb800">35 MACHINES</span></b><button onclick="Pi.authenticate(['username'],a=>alert(a.user.username))" style="background:#6f42c1;color:#fff;border:0;padding:8px 14px;border-radius:20px">π Login</button></div>
<div id="grid" class="grid"></div>
<div class="cart">Cart: <span id="c">0</span> • <span id="t">0 Pi</span></div>
<script>
try{ Pi.init({version:"2.0"}); }catch(e){}

const EMOJI = {PLANTER:"🌱", FERT:"💩", SPRAYER:"🚿", PLOUGH:"🚜", HARVEST:"🌾"};

const products=[
 {n:"John Deere DB120 48-Row",p:55,c:"PLANTER"},{n:"Case IH 2150 Early Riser",p:42,c:"PLANTER"},{n:"Kinze 4705 36-Row",p:48,c:"PLANTER"},{n:"New Holland PLM Planter",p:38,c:"PLANTER"},{n:"John Deere 1725C CCS",p:32,c:"PLANTER"},
 {n:"John Deere 412R Sprayer",p:40,c:"SPRAYER"},{n:"John Deere F4365 Spreader",p:35,c:"FERT"},{n:"Case IH Titan 4540 Floater",p:38,c:"FERT"},{n:"New Holland Speedrower 220",p:30,c:"FERT"},{n:"Kuhn Axis 50.2",p:18,c:"FERT"},{n:"Amazone ZA-TS 4200",p:20,c:"FERT"},
 {n:"Claas Jaguar 990",p:80,c:"HARVEST"},{n:"New Holland FR650",p:72,c:"HARVEST"},{n:"John Deere 612R Sprayer 36m",p:45,c:"SPRAYER"},{n:"Case IH Patriot 4450",p:48,c:"SPRAYER"},{n:"New Holland Guardian SP.335F",p:42,c:"SPRAYER"},{n:"Kubota XTA Sprayer 24m",p:22,c:"SPRAYER"},
 {n:"John Deere 8R 410 + Disc Plow",p:28.5,c:"PLOUGH"},{n:"Case IH Steiger 620 + Ecolo",p:32,c:"PLOUGH"},{n:"Kubota M8-201 + Kverneland",p:18,c:"PLOUGH"},{n:"Massey 8737 + Gregoire",p:22,c:"PLOUGH"},{n:"John Deere 8RX 410 + Kuhn",p:33,c:"PLOUGH"},{n:"Case IH Magnum 400 + Horsch",p:27,c:"PLOUGH"},{n:"John Deere 9R 640 + Ripper",p:35,c:"PLOUGH"},{n:"Case IH Quadtrac 715",p:38,c:"PLOUGH"},{n:"New Holland T9.700 + Ecolo",p:30,c:"PLOUGH"},{n:"Claas Xerion 5000 + Lemken",p:29,c:"PLOUGH"},
 {n:"Claas Lexion 8900",p:95,c:"HARVEST"},{n:"New Holland CR10.90",p:88,c:"HARVEST"},{n:"John Deere X9 1100",p:92,c:"HARVEST"},{n:"Massey Ideal 9T",p:78,c:"HARVEST"},{n:"Kubota DC-105X",p:25,c:"HARVEST"},{n:"John Deere 9600 Forage",p:75,c:"HARVEST"},{n:"John Deere S790 Combine",p:85,c:"HARVEST"},{n:"Case IH Axial-Flow 8250",p:80,c:"HARVEST"},
];

let cart=[];
const grid=document.getElementById('grid');
grid.innerHTML = products.map((x,i)=>{
  let imgUrl = `/images/${x.c.toLowerCase()}.png`;
  // fallback: if image fails, show emoji
  return `<div class="card" onclick="cart.push(products[${i}]);document.getElementById('c').innerText=cart.length;document.getElementById('t').innerText=cart.reduce((a,b)=>a+b.p,0)+' Pi'">
    <div class="img" style="background-image:url('${imgUrl}'); background-color:#e9ecef" onerror="this.innerText='${EMOJI[x.c]}'">${EMOJI[x.c]}</div>
    <div class="badge b-${x.c}">${x.c}</div>
    <div class="name">${x.n}</div>
    <div class="price">${x.p} Pi</div>
  </div>`;
}).join('');
</script>
</body>
</html>
