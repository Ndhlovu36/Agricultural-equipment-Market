<style>
  body{margin:0;background:#0a1931;font-family:Arial,sans-serif;color:#fff}
 .header{position:sticky;top:0;z-index:10;background:#fff;color:#0a1931;display:flex;align-items:center;justify-content:space-between;padding:10px 12px;flex-wrap:wrap}
 .header b{color:#0a58ca}.header.yellow{color:#ffb800}
 .toggle{display:flex;background:#e9ecef;border-radius:20px;padding:3px}
 .toggle button{border:none;padding:6px 14px;border-radius:18px;font-weight:bold;cursor:pointer}
 .toggle.on{background:#0a58ca;color:#fff}
 .login{background:#6f42c1;color:#fff;border:none;border-radius:22px;padding:8px 16px;font-weight:bold}
 .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}
 .card{background:#fff;border-radius:14px;overflow:hidden;color:#000;position:relative;min-height:210px;display:flex;flex-direction:column}
 .card-img{height:135px;background:#e9ecef;background-size:cover;background-position:center}
 .badge{position:absolute;top:8px;left:8px;padding:3px 8px;border-radius:10px;font-size:11px;font-weight:bold;color:#fff}
 .b-fert{background:#8B4513}.b-planter{background:#6f42c1}.b-harvest{background:#ff8c00}.b-sprayer{background:#198754}.b-plough{background:#0d6efd}
 .info{padding:8px 8px 10px}
 .info b{font-size:13px;display:block;line-height:1.2}.info span{color:#0a58ca;font-weight:bold;font-size:15px}
 .cart{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#0a1931;border:2px solid #ffcc00;color:#fff;border-radius:28px;padding:12px 22px;font-weight:bold;text-align:center;cursor:pointer;box-shadow:0 4px 15px rgba(0,0,0,.4)}
</style>
</head>
<body>

function render(){
  document.getElementById('grid').innerHTML = products.map((p,i)=>{

    let badgeClass = 'b-'+p.cat.toLowerCase();

      <div class="badge ${badgeClass}">${p.cat}</div>
      <div class="info"><b>${p.name}</b><span>${p.price} Pi</span></div>
    </div>`
  }).join('');
}

function updateCart(){
  let total = cart.reduce((s,p)=>s+p.price,0);
  document.getElementById('cCount').innerText = cart.length;
  document.getElementById('cTotal').innerText = total.toFixed(1)+' Pi';
}
function setNet(n){
  net=n; Pi.init({version:"2.0", sandbox: n==='testnet'});
  document.getElementById('mainBtn').className = n==='mainnet'?'on':'';
  document.getElementById('testBtn').className = n==='testnet'?'on':'';
}

  Pi.authenticate(['username','payments'], (auth)=>{alert('Welcome '+auth.user.username)} );
}
