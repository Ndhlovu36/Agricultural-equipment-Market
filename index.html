<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agri Equipment Market - 24 MACHINES</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<style>
body{margin:0;font-family:Arial;background:#f1f5eb;padding-bottom:80px}
.header{background:#2e7d32;color:#fff;padding:14px;text-align:center;position:sticky;top:0;z-index:1000}
.switch{display:flex;justify-content:center;gap:10px;margin:8px 0}
.switch button{padding:7px 18px;border-radius:20px;border:2px solid #fff;font-weight:bold;cursor:pointer}
.active{background:#fff;color:#2e7d32}.inactive{background:transparent;color:#fff}
.top-btn{padding:9px 14px;border:none;border-radius:10px;font-weight:bold;margin:4px;cursor:pointer}
.grid{padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.card img{width:100%;height:135px;object-fit:cover;background:#e8e8e8}
.info{padding:8px}
.name{font-size:11px;font-weight:bold;height:34px;overflow:hidden;line-height:1.2}
.price{color:#2e7d32;font-weight:bold;font-size:14px}
.btn-buy{width:100%;padding:9px;background:#2e7d32;color:#fff;border:none;border-radius:9px;font-weight:bold;margin-top:4px;cursor:pointer}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:2000;justify-content:center;align-items:center;padding:12px}
.box{background:#fff;width:100%;max-width:360px;border-radius:14px;padding:16px}
.box input,.box textarea{width:100%;padding:10px;margin:5px 0;border:1px solid #ccc;border-radius:8px}
</style>
</head>
<body>
<div class="header">
<h2>🚜 Agri Equipment - 24 MACHINES</h2>
<div id="userLabel" style="font-size:12px">Not logged in</div>
<div class="switch">
<button id="btn-test" class="active" onclick="setMode('testnet')">Testnet</button>
<button id="btn-main" class="inactive" onclick="setMode('mainnet')">Mainnet</button>
</div>
<div>
<button id="loginBtn" class="top-btn" style="background:#ffca28;color:#333" onclick="loginPi()">🔐 Login with Pi</button>
<a href="https://wa.me/27700000000" target="_blank"><button class="top-btn" style="background:#25D366;color:#fff">WhatsApp</button></a>
</div>
</div>

<div class="grid" id="grid"></div>

<div class="modal" id="modal"><div class="box">
<img id="m-img" src="" style="width:100%;height:150px;object-fit:cover;border-radius:10px">
<h3 id="m-name" style="font-size:14px;margin:6px 0"></h3>
<div id="m-price" style="color:#2e7d32;font-weight:bold"></div>
<input id="d-name" placeholder="Full Name *">
<input id="d-phone" placeholder="Phone *">
<textarea id="d-address" rows="2" placeholder="Delivery Address *"></textarea>
<button class="btn-buy" onclick="confirmPay()">✅ Pay with Pi</button>
<button class="btn-buy" style="background:#888" onclick="closeModal()">Cancel</button>
</div></div>

<script>
let currentMode='testnet', currentProduct=null, piUser=null;
try{ Pi.init({version:"2.0",sandbox:true}); }catch(e){}

function setMode(m){
 currentMode=m;
 document.getElementById('btn-test').className = m==='testnet'? 'active' : 'inactive';
 document.getElementById('btn-main').className = m==='mainnet'? 'active' : 'inactive';
 try{ Pi.init({version:"2.0",sandbox:m==='testnet'}); }catch(e){}
}

const products=[
{name:"KUBOTA PRO 6000 Sprayer",price:2.5,image:"IMG-20260916-WA0169.jpg"},
{name:"JD X9 1100 Combine",price:8.9,image:"IMG-20260916-WA3079.jpg"},
{name:"JD 4120R Sprayer 120ft",price:4.2,image:"IMG-20260916-WA2077.jpg"},
{name:"CLAAS LEXION 8700",price:6.5,image:"IMG-20260920-WA7092.jpg"},
{name:"CASE 4540 Floater",price:3.8,image:"IMG-20260920-WA5226.jpg"},
{name:"JD 8R 410 + Disc",price:3.2,image:"IMG-20260920-WA3637.jpg"},
{name:"JD 8R Tillage",price:2.8,image:"IMG-20260917-WA4818.jpg"},
{name:"JD DB120 Planter",price:3.5,image:"IMG-20260920-WA4385.jpg"},
{name:"Kubota XTA Sprayer",price:1.8,image:"IMG-20260920-WA1709.jpg"},
{name:"JD 9RX 640 640HP",price:12,image:"IMG-20260921-WA4395.jpg"},
{name:"New Holland CR11 775HP",price:11,image:"IMG-20260921-WA0033.jpg"},
{name:"Fendt 1050 Vario 517HP",price:9.5,image:"IMG-20260921-WA1772.jpg"},
{name:"CAT Challenger MT875",price:8.5,image:"IMG-20260921-WA0256.jpg"},
{name:"Case IH Quadtrac 715 715HP",price:12,image:"IMG-20260921-WA2164.jpg"},
{name:"JD S780 Combine 471HP",price:7.5,image:"IMG-20260916-WA0052.jpg"},
{name:"JD S770 Combine",price:6.9,image:"IMG-20260916-WA0053.jpg"},
{name:"CLAAS Xerion 12.650",price:9.2,image:"IMG-20260916-WA0054.jpg"},
{name:"Amazone ZA-TS Spreader",price:1.2,image:"IMG-20260916-WA0055.jpg"},
{name:"Massey Ferguson 8S Tractor",price:3.9,image:"IMG-20260916-WA0056.jpg"},
{name:"JD 5075E Tractor Hire",price:0.8,image:"IMG-20260917-WA0001.jpg"},
{name:"Disc Harrow 24 Disc",price:1.1,image:"IMG-20260917-WA0002.jpg"},
{name:"Baler Round 1.5m",price:2.1,image:"IMG-20260917-WA0003.jpg"},
{name:"Trailer 10 Ton Tipper",price:1.5,image:"IMG-20260917-WA0004.jpg"},
{name:"Rotavator 2m Tiller",price:0.9,image:"IMG-20260917-WA0005.jpg"}
];

function render(){
 const g=document.getElementById('grid');
 g.innerHTML = products.map((p,i)=>`
  <div class="card">
    <img src="${p.image}" onerror="this.src='https://via.placeholder.com/300x135?text=No+Image'">
    <div class="info">
      <div class="name">${p.name}</div>
      <div class="price">π ${p.price}</div>
      <button class="btn-buy" onclick="openModal(${i})">Buy with Pi</button>
    </div>
  </div>
 `).join('');
}

function openModal(i){
 currentProduct=products[i];
 document.getElementById('m-img').src=currentProduct.image;
 document.getElementById('m-name').innerText=currentProduct.name;
 document.getElementById('m-price').innerText="π "+currentProduct.price+" - "+currentMode;
 document.getElementById('modal').style.display='flex';
}
function closeModal(){ document.getElementById('modal').style.display='none'; }

async function loginPi(){
 try{
  const scopes=['payments','username'];
  const auth = await Pi.authenticate(scopes, onIncomplete);
  piUser=auth.user;
  document.getElementById('userLabel').innerText="✓ "+auth.user.username+" ("+currentMode+")";
  document.getElementById('loginBtn').innerText="✓ Logged in";
  localStorage.setItem('pi_user',auth.user.username);
 }catch(e){ alert("Open in Pi Browser to Login"); }
}
function onIncomplete(p){ console.log("Incomplete",p); }

async function confirmPay(){
 const name=document.getElementById('d-name').value;
 const phone=document.getElementById('d-phone').value;
 const addr=document.getElementById('d-address').value;
 if(!name||!phone||!addr){ alert("Fill all delivery fields"); return; }
 if(!piUser){ await loginPi(); if(!piUser) return; }
 try{
  await Pi.createPayment({
   amount: currentProduct.price,
   memo: currentProduct.name+" - "+currentMode+" - 22 Sep 2026",
   metadata: {product:currentProduct.name, network:currentMode, delivery:name+" "+phone}
  },{
   onReadyForServerApproval:(id)=>{ console.log("Approval",id); },
   onReadyForServerCompletion:(id,txid)=>{
    alert("SUCCESS! Paid π "+currentProduct.price+" for "+currentProduct.name+"\nTx: "+txid+"\nNetwork: "+currentMode);
    closeModal();
   },
   onCancel:(id)=>{ console.log("Cancelled",id); },
   onError:(err)=>{ alert("Payment error: "+err.message); }
  });
 }catch(err){ console.error(err); }
}

render();
</script>
</body>
</html>
