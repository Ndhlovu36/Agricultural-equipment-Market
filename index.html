<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AGRI Pi MARKET • 35 MACHINES</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:Arial;background:#0a1931;color:#fff}
.header{background:#fff;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:99}
.logo{font-weight:900;color:#0052cc;font-size:14px}.logo span{color:#ffcc00}
.tabs{display:flex;gap:4px;background:#eee;padding:3px;border-radius:20px}
.tabs button{padding:6px 10px;border-radius:15px;border:none;font-size:9px;font-weight:900}
.tabs button.active{background:#0052cc;color:#fff}.tabs button.test-active{background:#ff4444;color:#fff}
.btn{padding:8px 12px;border-radius:20px;border:none;font-weight:900;font-size:10px;background:#6a1bbf;color:#fff}
.mode-banner{text-align:center;padding:8px;font-size:11px;font-weight:900;color:#fff}.mode-main{background:#6a1bbf}.mode-test{background:#ff4444}
.hero{background:linear-gradient(180deg,#0d2550,#06102a);padding:18px 12px;text-align:center}
.hero h1{color:#ffcc00;font-size:26px;font-weight:900}.hero h1 span{color:#fff;font-size:18px}
.hero p{font-size:10px;margin-top:8px;color:#cbd5e1}
.filters{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:12px}
.filters button{padding:7px 12px;border-radius:20px;border:none;font-size:10px;font-weight:900;background:#fff;color:#0a1931}
.filters button.active{background:#0052cc;color:#fff}
.section{max-width:1200px;margin:auto;padding:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(min-width:900px){.grid{grid-template-columns:1fr 1fr 1fr 1fr}}
.card{background:#fff;border-radius:12px;overflow:hidden;color:#0a1931;position:relative;cursor:pointer}
.card img{width:100%;height:130px;object-fit:cover;background:#ddd}.badge{position:absolute;top:6px;left:6px;padding:3px 7px;border-radius:10px;font-size:8px;font-weight:900;color:#fff}
.b-plough{background:#0052cc}.b-harvest{background:#ff8800}.b-spray{background:#00aa55}.b-fert{background:#aa5500}.b-planter{background:#6a1bbf}
.card-body{padding:7px}.card-body h3{font-size:10px}.price{font-weight:900;color:#0052cc;font-size:12px;margin-top:4px}
.cart{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0a1931;border:2px solid #ffcc00;color:#fff;padding:12px 20px;border-radius:30px;font-size:12px;font-weight:900;z-index:200}
.pi-status{font-size:10px;background:#f0f0f0;color:#000;padding:8px;border-radius:8px;margin-top:10px;word-break:break-all}
</style>
</head>
<body>
<div id="modeBanner" class="mode-banner mode-main">MODE: MAINNET Pi - Real Payments Live - 404 Fixed</div>
<div class="header"><div class="logo">AGRI Pi MARKET • 35<br><span>MACHINES</span></div><div style="display:flex;gap:6px"><div class="tabs"><button id="btnMain" class="active" onclick="setMode(false)">MAINNET</button><button id="btnTest" onclick="setMode(true)">TESTNET</button></div><button id="loginBtn" class="btn" onclick="piLogin()">π Login</button></div></div>
<div class="hero"><h1>35 HUGE MACHINERY<br><span>ALL PRICES IN Pi ONLY</span></h1><p>10 Ploughing • 10 Harvesting • 5 Sprayer • 5 Fertilizer • 5 Planter</p><div class="filters"><button id="f-all" class="active" onclick="filterCat('all')">ALL 35</button><button id="f-plough" onclick="filterCat('plough')">PLOUGHING (10)</button><button id="f-harvest" onclick="filterCat('harvest')">HARVESTING (10)</button><button id="f-sprayer" onclick="filterCat('sprayer')">SPRAYER (5)</button><button id="f-fert" onclick="filterCat('fert')">FERTILIZER (5)</button><button id="f-planter" onclick="filterCat('planter')">PLANTER (5)</button></div><div id="piStatus" class="pi-status">✅ File Loaded - Open in Pi Browser - Tap machine - Pay</div></div>
<div class="section"><div id="grid" class="grid"></div></div>
<div id="cart" class="cart" onclick="checkout()">Cart: 0 • 0 Pi • Pay with Pi</div>
<script>
let isTestnet=false,piUser=null,currentCat='all',cart=[],cartTotal=0;
const machines=[
{id:1,cat:'plough',file:'AGRI-01-PLOUGH-JohnDeere-8R-410-Disc.jpg',brand:'John Deere',name:'8R 410 + 2140 Disc Plow',pi:28.5},
{id:2,cat:'plough',file:'AGRI-02-PLOUGH-CaseIH-Steiger-620-Ecolo.jpg',brand:'Case IH',name:'Steiger 620 + Ecolo-Tiger',pi:32},
{id:3,cat:'plough',file:'AGRI-03-PLOUGH-JohnDeere-9R-640-Ripper.jpg',brand:'John Deere',name:'9R 640 + Ripper',pi:35},
{id:4,cat:'plough',file:'AGRI-04-PLOUGH-CaseIH-Quadtrac-715.jpg',brand:'Case IH',name:'Quadtrac 715',pi:38},
{id:5,cat:'plough',file:'AGRI-05-PLOUGH-NewHolland-T9-700.jpg',brand:'New Holland',name:'T9.700 + Ecolo-Tiger',pi:30},
{id:6,cat:'plough',file:'AGRI-06-PLOUGH-Claas-Xerion-5000.jpg',brand:'Claas',name:'Xerion 5000 + Lemken',pi:29},
{id:7,cat:'plough',file:'AGRI-07-PLOUGH-Kubota-M8-201.jpg',brand:'Kubota',name:'M8-201 + Kverneland',pi:18},
{id:8,cat:'plough',file:'AGRI-08-PLOUGH-Massey-8737.jpg',brand:'Massey',name:'8737 + Gregoire Besson',pi:22},
{id:9,cat:'plough',file:'AGRI-09-PLOUGH-JohnDeere-8RX-410.jpg',brand:'John Deere',name:'8RX 410 + Kuhn',pi:33},
{id:10,cat:'plough',file:'AGRI-10-PLOUGH-CaseIH-Magnum-400.jpg',brand:'Case IH',name:'Magnum 400 + Horsch',pi:27},
{id:11,cat:'harvest',file:'AGRI-11-HARVEST-JohnDeere-S790.jpg',brand:'John Deere',name:'S790 Combine',pi:85},
{id:12,cat:'harvest',file:'AGRI-12-HARVEST-CaseIH-8250.jpg',brand:'Case IH',name:'Axial-Flow 8250',pi:82},
{id:13,cat:'harvest',file:'AGRI-13-HARVEST-Claas-Lexion-8900.jpg',brand:'Claas',name:'Lexion 8900',pi:95},
{id:14,cat:'harvest',file:'AGRI-14-HARVEST-NewHolland-CR10-90.jpg',brand:'New Holland',name:'CR10.90',pi:88},
{id:15,cat:'harvest',file:'AGRI-15-HARVEST-JohnDeere-X9-1100.jpg',brand:'John Deere',name:'X9 1100',pi:92},
{id:16,cat:'harvest',file:'AGRI-16-HARVEST-Massey-Ideal-9T.jpg',brand:'Massey',name:'Ideal 9T',pi:78},
{id:17,cat:'harvest',file:'AGRI-17-HARVEST-Kubota-DC-105X.jpg',brand:'Kubota',name:'DC-105X',pi:25},
{id:18,cat:'harvest',file:'AGRI-18-HARVEST-JohnDeere-9600-Forage.jpg',brand:'John Deere',name:'9600 Forage',pi:75},
{id:19,cat:'harvest',file:'AGRI-19-HARVEST-Claas-Jaguar-990.jpg',brand:'Claas',name:'Jaguar 990',pi:80},
{id:20,cat:'harvest',file:'AGRI-20-HARVEST-NewHolland-FR650.jpg',brand:'New Holland',name:'FR650',pi:72},
{id:21,cat:'sprayer',file:'AGRI-21-SPRAYER-JohnDeere-612R.jpg',brand:'John Deere',name:'612R Sprayer 36m',pi:45},
{id:22,cat:'sprayer',file:'AGRI-22-SPRAYER-CaseIH-Patriot-4450.jpg',brand:'Case IH',name:'Patriot 4450',pi:48},
{id:23,cat:'sprayer',file:'AGRI-23-SPRAYER-NewHolland-Guardian.jpg',brand:'New Holland',name:'Guardian SP.335F',pi:42},
{id:24,cat:'sprayer',file:'AGRI-24-SPRAYER-Kubota-XTA.jpg',brand:'Kubota',name:'XTA Sprayer 24m',pi:22},
{id:25,cat:'sprayer',file:'AGRI-25-SPRAYER-JohnDeere-412R.jpg',brand:'John Deere',name:'412R Sprayer',pi:40},
{id:26,cat:'fert',file:'AGRI-26-FERT-JohnDeere-F4365.jpg',brand:'John Deere',name:'F4365 Spreader',pi:35},
{id:27,cat:'fert',file:'AGRI-27-FERT-CaseIH-Titan-4540.jpg',brand:'Case IH',name:'Titan 4540 Floater',pi:38},
{id:28,cat:'fert',file:'AGRI-28-FERT-NewHolland-Speedrower-220.jpg',brand:'New Holland',name:'Speedrower 220',pi:30},
{id:29,cat:'fert',file:'AGRI-29-FERT-Kuhn-Axis-50.jpg',brand:'Kuhn',name:'Axis 50.2',pi:18},
{id:30,cat:'fert',file:'AGRI-30-FERT-Amazone-ZA-TS-4200.jpg',brand:'Amazone',name:'ZA-TS 4200',pi:20},
{id:31,cat:'planter',file:'AGRI-31-PLANTER-JohnDeere-DB120.jpg',brand:'John Deere',name:'DB120 48-Row',pi:55},
{id:32,cat:'planter',file:'AGRI-32-PLANTER-CaseIH-2150.jpg',brand:'Case IH',name:'2150 Early Riser',pi:42},
{id:33,cat:'planter',file:'AGRI-33-PLANTER-Kinze-4705.jpg',brand:'Kinze',name:'4705 36-Row',pi:48},
{id:34,cat:'planter',file:'AGRI-34-PLANTER-NewHolland-PLM.jpg',brand:'New Holland',name:'PLM Planter',pi:38},
{id:35,cat:'planter',file:'AGRI-35-PLANTER-JohnDeere-1725C.jpg',brand:'John Deere',name:'1725C 12-Row',pi:32}
];
function initPi(){try{if(window.Pi) Pi.init({version:"2.0",sandbox:isTestnet});}catch(e){}}
function setMode(test){isTestnet=test;initPi();document.getElementById('modeBanner').className='mode-banner '+(test?'mode-test':'mode-main');document.getElementById('modeBanner').innerText=test?'MODE: TESTNET Pi':'MODE: MAINNET Pi - Real Payments - 404 Fixed';document.getElementById('btnMain').className=test?'':'active';document.getElementById('btnTest').className=test?'test-active':'';}
function filterCat(cat){currentCat=cat;document.querySelectorAll('.filters button').forEach(b=>b.classList.remove('active'));document.getElementById('f-'+cat).classList.add('active');render();}
function render(){const g=document.getElementById('grid');let list=currentCat==='all'?machines:machines.filter(m=>m.cat===currentCat);let h='';for(let i=0;i<list.length;i++){const m=list[i];const bc=m.cat==='plough'?'b-plough':m.cat==='harvest'?'b-harvest':m.cat==='sprayer'?'b-spray':m.cat==='fert'?'b-fert':'b-planter';h+='<div class="card" onclick="addToCart('+m.id+')"><span class="badge '+bc+'">'+m.cat.toUpperCase()+'</span><img src="'+m.file+'" onerror="this.src=`https://via.placeholder.com/300x200?text='+m.brand+'`"><div class="card-body"><h3>'+m.brand+' '+m.name+'</h3><div class="price">'+m.pi+' Pi</div></div></div>';}g.innerHTML=h;}
function addToCart(id){const m=machines.find(x=>x.id===id);cart.push(m);cartTotal+=m.pi;document.getElementById('cart').innerText='Cart: '+cart.length+' • '+cartTotal.toFixed(1)+' Pi • Pay';}
async function piLogin(){const st=document.getElementById('piStatus');if(typeof Pi==='undefined'){st.innerText='Open in Pi Browser';return;}initPi();st.innerText='Connecting...';try{const a=await Pi.authenticate(['username','payments'],()=>{});piUser=a.user;st.innerText='@'+a.user.username+' Connected';document.getElementById('loginBtn').innerText='@'+a.user.username;}catch(e){st.innerText='Login failed '+e.message;}}
async function checkout(){const st=document.getElementById('piStatus');if(cart.length===0){st.innerText='Cart empty';return;}if(!piUser){piLogin();return;}initPi();const total=cartTotal;Pi.createPayment({amount:total,memo:'AGRI '+cart.length+' machines '+total+' Pi',metadata:{cart:cart.map(c=>c.id)}},{onReadyForServerApproval:async function(pid){st.innerText='Approving '+pid;await fetch('/api/approve-payment',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paymentId:pid})});},onReadyForServerCompletion:async function(pid,txid){st.innerText='Completing '+txid;await fetch('/api/complete-payment',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paymentId:pid,txid:txid})});st.innerText='PAID TX:'+txid;cart=[];cartTotal=0;},onCancel:function(){st.innerText='Cancelled';},onError:function(e){st.innerText='Error '+e;}});}
initPi();setMode(false);render();
</script>
</body>
</html>
