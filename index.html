<!DOCTYPE html>
<html><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agri Equipment Market - Pi</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<style>
body{margin:0;font-family:Arial;background:#eef2e8}
.header{background:#2e7d32;color:#fff;padding:14px;text-align:center;position:sticky;top:0;z-index:99}
.switch{display:flex;justify-content:center;gap:8px;margin:10px 0}
.switch button{padding:8px 16px;border-radius:20px;border:2px solid #fff;background:transparent;color:#fff;font-weight:bold}
.switch button.active{background:#fff;color:#2e7d32}
.top-actions{display:flex;gap:8px;justify-content:center;margin:8px}
.top-actions button{padding:8px 14px;border-radius:8px;border:none;font-weight:bold}
.login{background:#ff9800;color:#fff}
.wa{background:#25D366;color:#fff}
.grid{padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 3px 10px rgba(0,0,0,.15)}
.card img{width:100%;height:160px;object-fit:cover}
.body{padding:10px}
.price{color:#2e7d32;font-weight:bold;font-size:16px}
.btn{width:100%;padding:10px;background:#2e7d32;color:#fff;border:none;border-radius:8px;margin-top:6px;font-weight:bold}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.7);z-index:999;justify-content:center;align-items:center}
.modal-box{background:#fff;width:90%;max-width:400px;border-radius:16px;padding:20px}
.modal-box input, .modal-box textarea{width:100%;padding:10px;margin:6px 0;border-radius:8px;border:1px solid #ccc;box-sizing:border-box}
</style>
</head>
<body>
<div class="header">
<h2 style="margin:0">🚜 Agri Market - Pi</h2>
<small id="user">Not logged in</small>
<div class="switch">
<button id="btn-test" class="active" onclick="setMode('testnet')">Testnet</button>
<button id="btn-main" onclick="setMode('mainnet')">Mainnet</button>
</div>
<div class="top-actions">
<button class="login" onclick="piLogin()">🔐 Login with Pi</button>
<a id="waLink" href="https://wa.me/27810000000?text=Hello Agri Market" target="_blank"><button class="wa">WhatsApp Us</button></a>
</div>
<small>Authentic Equipment • Pay with Pi • Gauteng</small>
</div>

<div class="grid" id="grid"></div>

<!-- Checkout Modal -->
<div class="modal" id="modal">
<div class="modal-box">
<h3 id="m-name"></h3>
<p id="m-price" class="price"></p>
<input id="d-name" placeholder="Your Full Name">
<input id="d-phone" placeholder="Phone / WhatsApp Number">
<textarea id="d-address" placeholder="Delivery Address - Farm Location, City, Province"></textarea>
<input id="d-notes" placeholder="Notes (optional)">
<button class="btn" onclick="confirmPay()">Confirm & Pay with Pi</button>
<button class="btn" style="background:#999" onclick="closeModal()">Cancel</button>
</div>
</div>

<script>
let piUser=null, currentMode='testnet', currentProduct=null;
Pi.init({version:"2.0", sandbox:true});

function setMode(mode){
 currentMode=mode;
 document.getElementById('btn-test').classList.toggle('active',mode==='testnet');
 document.getElementById('btn-main').classList.toggle('active',mode==='mainnet');
 Pi.init({version:"2.0", sandbox: mode==='testnet'});
 alert("Switched to "+mode.toUpperCase()+" - Relogin required");
}

function piLogin(){
 Pi.authenticate(['username','payments'],{
   onComplete: function(auth){ piUser=auth.user; document.getElementById('user').innerText='👋 '+piUser.username; alert('Welcome '+piUser.username); },
   onError: function(e){ alert('Login failed: '+e); }
 });
}

const products=[
{name:"KUBOTA DSM-W PRO 6000 Trailer",price:1250,old:1850,image:"./IMG-20260916-WA0169.jpg",desc:"6000L Precision Spreader"},
{name:"John Deere X9 1100 Combine Harvester",price:8900,old:12000,image:"./IMG-20260916-WA3079.jpg",desc:"45ft Header, 700hp"},
{name:"John Deere 4120M Sprayer 120ft Boom",price:4200,old:5500,image:"./IMG-20260916-WA2077.jpg",desc:"Self-propelled, 120ft"},
{name:"CLAAS LEXION 8700",price:185,old:220,image:"./IMG-20260920-WA7092.jpg",desc:"Combine"},
{name:"CASE IH 4540",price:145,old:180,image:"./IMG-20260920-WA5226.jpg",desc:"Floating Sprayer"},
{name:"John Deere 8R 410 + Disc",price:125,old:150,image:"./IMG-20260920-WA3637.jpg",desc:"Tractor System"},
{name:"John Deere 8R Tillage",price:115,old:140,image:"./IMG-20260917-WA4818.jpg",desc:"Field Work"},
{name:"John Deere DB120 Planter",price:135,old:165,image:"./IMG-20260920-WA4385.jpg",desc:"48-Row"},
{name:"Kubota Trailed Sprayer",price:68,old:90,image:"./IMG-20260920-WA1709.jpg",desc:"XTA 3324"}
];

const grid=document.getElementById('grid');
products.forEach(p=>{
 grid.innerHTML+=`<div class="card"><img src="${p.image}" loading="lazy"><div class="body"><h3 style="margin:0;font-size:13px">${p.name}</h3><small>${p.desc}</small><div class="price">π ${p.price} <span style="text-decoration:line-through;color:#999;font-size:12px">π ${p.old}</span></div><button class="btn" onclick="openModal('${p.name}',${p.price},'${p.image}')">Buy with Pi</button></div></div>`;
});

function openModal(name,price,img){
 if(!piUser){ alert('Please Login with Pi first!'); piLogin(); return; }
 currentProduct={name,price,img};
 document.getElementById('m-name').innerText=name;
 document.getElementById('m-price').innerText='π '+price;
 document.getElementById('modal').style.display='flex';
}
function closeModal(){ document.getElementById('modal').style.display='none'; }

function confirmPay(){
 const addr=document.getElementById('d-address').value;
 const phone=document.getElementById('d-phone').value;
 const cname=document.getElementById('d-name').value;
 if(!addr||!phone||!cname){ alert('Fill Name, Phone & Delivery Address'); return; }
 closeModal();
 // Pi Payment
 Pi.createPayment({amount:currentProduct.price,memo:currentProduct.name+" | Delivery: "+addr,metadata:{product:currentProduct.name,delivery:addr,phone:phone,name:cname,mode:currentMode}},{
   onReadyForServerApproval: id=>fetch('/api/approve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paymentId:id})}),
   onReadyForServerCompletion:(id,txid)=>{
     fetch('/api/complete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paymentId:id,txid:txid,delivery:addr})});
     alert('✅ Payment Success! Order: '+currentProduct.name+'\nDelivery to: '+addr+'\nWe will WhatsApp you on '+phone);
     // auto open WhatsApp with order
     window.open(`https://wa.me/27810000000?text=New Order: ${encodeURIComponent(currentProduct.name)} - Pi ${currentProduct.price}%0AName:${encodeURIComponent(cname)}%0APhone:${encodeURIComponent(phone)}%0AAddress:${encodeURIComponent(addr)}`,'_blank');
   },
   onCancel:()=>alert('Payment Cancelled'),
   onError:e=>alert('Payment Error: '+e)
 });
}
</script>
</body>
</html>
