<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agri Market Pi - 28 Products FIXED</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<style>
body{margin:0;background:#0a2a12;color:#fff;font-family:Arial}
.top{display:flex;justify-content:space-between;align-items:center;padding:10px;background:#123d1a;position:sticky;top:0;z-index:10;flex-wrap:wrap;gap:6px}
.tab{padding:6px 12px;border-radius:20px;background:#1a4d24;cursor:pointer;font-size:13px}.tab.active{background:#2ecc71;color:#000;font-weight:bold}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px}
.card{background:#123d1a;border-radius:10px;overflow:hidden;text-align:center;padding-bottom:6px;border:1px solid #1a4d24}
.card img{width:100%;height:150px;object-fit:cover;background:#1a4d24;display:block}
.pi{color:#2ecc71;font-weight:bold;margin:4px}.pi.test{color:#ffcc00}
button{width:90%;margin:6px;background:#2ecc71;border:0;border-radius:6px;padding:9px;font-weight:bold}
button.testprice{background:#ffcc00;color:#000}
input,select,textarea{width:90%;padding:9px;margin:6px;border-radius:6px;border:0}
.delivery{background:#fff;color:#000;padding:12px;border-radius:10px;margin:10px;text-align:left;border:2px solid #2ecc71}
.status{margin:10px;padding:10px;background:#000;border-radius:8px;font-size:12px}
.banner{padding:8px;text-align:center;font-weight:bold;background:#ffcc00;color:#000}
.imgFallback{height:150px;display:flex;align-items:center;justify-content:center;background:#1a4d24;color:#2ecc71;font-weight:bold;font-size:11px;padding:8px;text-align:center}
</style></head><body>
<div class="top"><div id="user">Not logged</div><div><span id="testTab" class="tab active" onclick="setNet(true)">Testnet 0.05</span> <span id="mainTab" class="tab" onclick="setNet(false)">Mainnet 2.5-10</span></div><button onclick="login()" id="loginBtn" style="width:auto;padding:6px 14px">Login Pi</button></div>
<div class="banner" id="banner">TEST: 0.05 Pi | MAINNET: 2.5-10 Pi - FIXED NO BLACK BOX</div>
<div style="text-align:center;padding:8px"><input id="email" placeholder="Email for receipt *"></div>
<div class="delivery"><b>📦 DELIVERY ADDRESS</b><br><select id="province"><option value="">-- Province --</option><option>Gauteng</option><option>KwaZulu-Natal</option><option>Western Cape</option><option>Eastern Cape</option><option>Limpopo</option><option>Mpumalanga</option><option>North West</option><option>Free State</option><option>Northern Cape</option></select><input id="city" placeholder="City *"><input id="street" placeholder="Street / Farm *"><input id="phone" placeholder="Phone *"><textarea id="instructions" style="width:90%;height:50px" placeholder="Delivery note"></textarea></div>
<div id="status" class="status">Ready - 28 Products - Fill address</div>
<div class="grid" id="grid"></div>
<script>
const TEST_PRICE=0.05;
const REAL_PRICES=[2.5,2.8,3.0,3.3,3.6,3.9,4.1,4.4,4.7,5.0,5.2,5.5,5.8,6.1,6.4,6.7,7.0,7.3,7.6,8.0,8.3,8.6,8.8,9.0,9.3,9.5,9.8,10.0];
const names=["KUBOTA PRO 6000","JD X9 1100","JD 4120R","CLAAS LEXION 8700","CASE 4540","JD 8R 410 + Disc","JD 8R Tillage","JD DB120 Planter","Kubota XTA","JD 9RX 640","New Holland CR11","Fendt 1050","CAT Challenger","Case Quadtrac 715","JD S780","Fendt IDEAL 10T","Case Magnum 400","New Holland T9.700","Kubota M8-200","CLAAS Axion 960","Fruit Harvester","Kuhn Fertilizer 1","Fertilizer Spreader","Kverneland","Kubota M7-150","JD 6R 250","Deutz 9340","JD S790"];
const files=["IMG-20260916-WA0169.jpg","IMG-20260916-WA3079.jpg","IMG-20260916-WA2077.jpg","IMG-20260920-WA7092.jpg","IMG-20260920-WA5226.jpg","IMG-20260920-WA3637.jpg","IMG-20260917-WA4818.jpg","IMG-20260920-WA4385.jpg","IMG-20260920-WA1709.jpg","IMG-20260921-WA4395.jpg","IMG-20260921-WA0033.jpg","IMG-20260921-WA1772.jpg","IMG-20260921-WA0256.jpg","IMG-20260921-WA2164.jpg","IMG-20260921-WA9268.jpg","IMG-20260921-WA6086.jpg","IMG-20260921-WA2395.jpg","IMG-20260921-WA5915.jpg","IMG-20260921-WA2428.jpg","IMG-20260921-WA4395.jpg","IMG-20260921-WA2479.jpg","IMG-20260921-WA5882.jpg","IMG-20260921-WA4183.jpg","IMG-20260921-WA2400.jpg","IMG-20260916-WA3970.jpg","IMG-20260916-WA6299.jpg","IMG-20260916-WA0911.jpg","IMG-20260921-WA2523.jpg"];
let base="./";
let isTestnet=true,currentUser=null;
Pi.init({version:"2.0",sandbox:true});
function setNet(t){isTestnet=t;document.getElementById('testTab').classList.toggle('active',t);document.getElementById('mainTab').classList.toggle('active',!t);Pi.init({version:"2.0",sandbox:t});document.getElementById('banner').innerText=t?`TEST: ${TEST_PRICE} Pi ALL`:`MAINNET: 2.5-10 Pi`;render();}
function onIncomplete(p){fetch("/api/complete",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({paymentId:p.identifier,txid:p.transaction?p.transaction.txid:""})});}
function login(){let b=document.getElementById('loginBtn');b.innerText="⏳ Wait...";Pi.authenticate(["username","payments"],{onIncompletePaymentFound:onIncomplete}).then(a=>{currentUser=a.user;document.getElementById('user').innerText="Hi "+a.user.username;b.innerText="✅ "+a.user.username;document.getElementById('status').innerText="✅ Logged in "+a.user.username;}).catch(()=>{b.innerText="Login Pi";});}
function render(){let h="";for(let i=0;i<28;i++){let pr=isTestnet?TEST_PRICE:REAL_PRICES[i];h+=`<div class=card><img src="${base}${files[i]}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';"><div class='imgFallback' style='display:none'>🚜 ${names[i]}</div><div style="font-size:11px;padding:4px;height:32px;overflow:hidden">${names[i]}</div><div class="pi ${isTestnet?'test':''}">${pr} Pi</div><button class="${isTestnet?'testprice':''}" onclick="buy(${pr},'${names[i]}')">Buy ${pr} Pi</button></div>`;}document.getElementById('grid').innerHTML=h;}
function getDel(){let c=document.getElementById('city').value.trim(),s=document.getElementById('street').value.trim(),p=document.getElementById('phone').value.trim(),pr=document.getElementById('province').value;if(!c||!s||!p)return null;return{full:`${pr}, ${c}, ${s}, Phone:${p}`,city:c};}
async function buy(amount,memo){let e=document.getElementById('email').value.trim();let d=getDel();if(!e.includes("@")){alert("Enter email");return;}if(!d){alert("Fill City, Street, Phone");return;}try{if(!currentUser){let a=await Pi.authenticate(["username","payments"],{onIncompletePaymentFound:onIncomplete});currentUser=a.user;}document.getElementById('status').innerText=`Paying ${amount} Pi for ${memo}...`;Pi.createPayment({amount:amount,memo:(memo+" to "+d.city).slice(0,80),metadata:{email:e,machine:memo,address:d.full}},{onReadyForServerApproval:id=>{fetch("/api/approve",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({paymentId:id,network:isTestnet?'test':'main'})}).then(()=>{document.getElementById('status').innerText="Approved - Confirm NOW (60s)";}).catch(()=>{document.getElementById('status').innerText="Approved (Testnet) - Confirm NOW";});},onReadyForServerCompletion:(id,tx)=>{fetch("/api/complete",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({paymentId:id,txid:tx})}).then(()=>{document.getElementById('status').innerText=`✅ SUCCESS ${amount} Pi - ${memo}`;alert(`SUCCESS ${amount} Pi\n${memo}\nTX:${tx}`);});},onCancel:()=>{document.getElementById('status').innerText="Cancelled";},onError:err=>{document.getElementById('status').innerText="Error "+err;}});}catch(err){document.getElementById('status').innerText="Auth failed "+err.message;}}
render();
</script></body></html>
