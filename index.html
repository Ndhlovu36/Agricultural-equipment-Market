<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agri Market Pi</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<style>
body{margin:0;background:#0a2a12;color:#fff;font-family:Arial}
.top{display:flex;justify-content:space-between;align-items:center;padding:10px;background:#123d1a;position:sticky;top:0;z-index:10}
.tabs{display:flex;gap:6px}
.tab{padding:6px 12px;border-radius:20px;background:#1a4d24;cursor:pointer;font-size:13px}
.tab.active{background:#2ecc71;color:#000;font-weight:bold}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px}
.card{background:#123d1a;border-radius:10px;overflow:hidden;text-align:center;padding-bottom:6px}
.card img{width:100%;height:150px;object-fit:cover}
.pi{color:#2ecc71;font-weight:bold;margin:4px}
button{width:90%;margin:6px;background:#2ecc71;border:0;border-radius:6px;padding:9px;font-weight:bold;cursor:pointer}
input,select,textarea{width:90%;padding:9px;margin:6px;border-radius:6px;border:0}
.foot{text-align:center;padding:15px;background:#123d1a;margin-top:10px;font-size:12px}
.delivery{background:#fff;color:#000;padding:12px;border-radius:10px;margin:10px;text-align:left;border:2px solid #2ecc71}
.delivery b{color:#0a2a12}
.status{margin:10px;padding:10px;background:#000;border-radius:8px;font-size:12px}
</style>
</head>
<body>
<div class="top">
<div id="user">Not logged</div>
<div class="tabs">
<div id="testTab" class="tab active" onclick="setNet(true)">Testnet</div>
<div id="mainTab" class="tab" onclick="setNet(false)">Mainnet</div>
</div>
<button onclick="login()" id="loginBtn" style="width:auto;padding:6px 14px">Login Pi</button>
</div>

<div style="text-align:center;padding:8px">
<input id="email" placeholder="Your email for receipt">
</div>

<!-- DELIVERY ADDRESS - REQUIRED FOR ALL 24 MACHINES -->
<div class="delivery">
<b>📦 DELIVERY ADDRESS (Required for delivery)</b><br>
<select id="province"><option value="">-- Select Province --</option><option>Gauteng</option><option>KwaZulu-Natal</option><option>Western Cape</option><option>Eastern Cape</option><option>Limpopo</option><option>Mpumalanga</option><option>North West</option><option>Free State</option><option>Northern Cape</option></select>
<input id="city" placeholder="City / Town *">
<input id="street" placeholder="Street / Farm Name & Number *">
<input id="phone" placeholder="Phone 0XX XXX XXXX *">
<textarea id="instructions" style="width:90%;height:50px" placeholder="Gate code, landmark, delivery note (optional)"></textarea>
</div>

<div id="status" class="status">✅ Ready - Fill address + email, select machine, login</div>

<h3 style="text-align:center">24 Machines - Pi Only</h3>
<div class="grid" id="grid">Loading machines...</div>
<div class="foot">Contact: agriequipmentmarket@gmail.com<br>Pi App Wallet Payments - Secure Delivery 3-7 days</div>

<script>
let isTestnet = true;
Pi.init({version:"2.0", sandbox:true});

function setNet(test){
 isTestnet = test;
 document.getElementById('testTab').classList.toggle('active', test);
 document.getElementById('mainTab').classList.toggle('active', !test);
 Pi.init({version:"2.0", sandbox:test});
}

function onIncomplete(payment){
 console.log("Incomplete found", payment);
 if(payment.transaction && payment.transaction.txid){
   return fetch("/api/complete",{
     method:"POST", headers:{"Content-Type":"application/json"},
     body:JSON.stringify({paymentId:payment.identifier, txid:payment.transaction.txid})
   });
 }
 return fetch("/api/complete",{
   method:"POST", headers:{"Content-Type":"application/json"},
   body:JSON.stringify({paymentId:payment.identifier, txid:""})
 });
}

function login(){
 let btn=document.getElementById('loginBtn');
 btn.innerText="⏳ Check Pi popup...";
 Pi.authenticate(["username","payments"],{onIncompletePaymentFound:onIncomplete})
 .then(auth=>{
   document.getElementById('user').innerText="Hi "+auth.user.username;
   btn.innerText="✅ "+auth.user.username;
   document.getElementById('status').innerText="✅ Logged in as "+auth.user.username+" - Ready to buy";
 })
 .catch(e=>{
   btn.innerText="Login Pi - Tap Again";
   document.getElementById('status').innerText="Login closed? Tap Login again and ALLOW";
 });
}

const names=["16 0169","16 2077","16 2079","16 2080","16 2081","16 2082","16 2083","16 2084","16 2085","16 2086","16 2087","16 2088","16 2089","16 2090","16 2091","16 2092","16 2093","16 2094","16 2095","16 2096","16 2097","16 2098","16 2099","16 2100"];
const prices=[21,8,7,11,12,15,18,22,9,14,16,19,13,10,17,20,23,24,25,26,27,28,29,30];

fetch("https://api.github.com/repos/ndhlovu36/agricultural-equipment-market/contents")
.then(r=>r.json()).then(files=>{
 let imgs=files.filter(f=>f.name.toLowerCase().endsWith(".jpg")).map(f=>f.download_url);
 let h="";
 for(let i=0;i<24;i++){
  h+=`<div class=card><img src="${imgs[i%imgs.length]}"><div>${names[i]}</div><div class=pi>${prices[i]} Pi</div><button onclick="buy(${prices[i]},'${names[i]}')">Buy ${prices[i]} Pi</button></div>`;
 }
 document.getElementById('grid').innerHTML=h;
});

function getDelivery(){
 let prov=document.getElementById('province').value.trim();
 let city=document.getElementById('city').value.trim();
 let street=document.getElementById('street').value.trim();
 let phone=document.getElementById('phone').value.trim();
 let note=document.getElementById('instructions').value.trim();
 if(!city||!street||!phone){return null;}
 return {province:prov,city,street,phone,note,full:`${prov}, ${city}, ${street}, Phone:${phone}, Note:${note}`};
}

function buy(amount,memo){
 let e=document.getElementById('email').value.trim();
 let delivery=getDelivery();
 if(!e){alert("Enter email first - for receipt");return;}
 if(!delivery){alert("Please fill Delivery City, Street, Phone - required for delivery");return;}
 
 document.getElementById('status').innerText="⏳ Processing "+memo+" to "+delivery.city+"...";
 
 Pi.authenticate(["username","payments"],{onIncompletePaymentFound:onIncomplete}).then(()=>{
   Pi.createPayment({
     amount: amount,
     memo: (memo+" to "+delivery.city).slice(0,80),
     metadata: {email:e, machine:memo, province:delivery.province, city:delivery.city, street:delivery.street, phone:delivery.phone, instructions:delivery.note, fullAddress:delivery.full}
   },{
     onReadyForServerApproval: function(paymentId){
       fetch("/api/approve",{
         method:"POST",
         headers:{"Content-Type":"application/json"},
         body:JSON.stringify({paymentId:paymentId})
       });
     },
     onReadyForServerCompletion: function(paymentId, txid){
       fetch("/api/complete",{
         method:"POST",
         headers:{"Content-Type":"application/json"},
         body:JSON.stringify({paymentId:paymentId, txid:txid, machine:memo, email:e, address:delivery.full})
       }).then(()=>{
         document.getElementById('status').innerText=`✅ SUCCESS Paid ${amount} Pi! Deliver to ${delivery.full}`;
         alert("SUCCESS! Paid "+amount+" Pi\nMachine: "+memo+"\nDeliver to: "+delivery.full+"\nReceipt to: "+e);
       });
     },
     onCancel: function(){document.getElementById('status').innerText="Payment cancelled";},
     onError: function(err){document.getElementById('status').innerText="Payment error "+err; alert("Payment error: "+err);}
   });
 }).catch(err=>{document.getElementById('status').innerText="Auth failed - tap Login again"; alert("Auth failed: "+err);});
}
</script>
</body>
</html>
