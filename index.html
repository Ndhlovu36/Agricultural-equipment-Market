<!DOCTYPE html>
<html><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agri Market Pi</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f1f5eb;padding-bottom:120px}
.header{background:#2e7d32;color:#fff;padding:14px;text-align:center;position:sticky;top:0;z-index:999}
.switch{display:flex;justify-content:center;gap:10px;margin:10px 0}
.switch button{padding:8px 18px;border-radius:20px;border:2px solid #fff;background:transparent;color:#fff;font-weight:bold}
.switch button.active{background:#fff;color:#2e7d32}
.actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.btn-top{padding:10px 16px;border-radius:10px;border:none;font-weight:bold}
.login{background:#ff9800;color:#fff} .wa{background:#25D366;color:#fff}
.grid{padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:12px;overflow-y:auto}
.card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.12);display:flex;flex-direction:column}
.card img{width:100%;height:140px;object-fit:cover;background:#fff}
.body{padding:10px;flex:1;display:flex;flex-direction:column}
.price{color:#2e7d32;font-weight:bold;margin:4px 0}
.btn{margin-top:auto;width:100%;padding:11px;background:#2e7d32;color:#fff;border:none;border-radius:10px;font-weight:bold}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.7);z-index:9999;justify-content:center;align-items:center;padding:12px}
.box{background:#fff;width:100%;max-width:380px;border-radius:16px;padding:18px;max-height:90vh;overflow-y:auto}
.box input,.box textarea{width:100%;padding:11px;margin:6px 0;border-radius:9px;border:1px solid #ccc}
.footer{position:fixed;bottom:0;left:0;width:100%;background:#2e7d32;color:#fff;text-align:center;padding:10px;font-size:12px}
</style>
</head>
<body>
<div class="header">
<h2 style="margin:0">🚜 Agri Market - Pi</h2>
<div id="user">❌ Not logged in - Open in Pi Browser</div>
<div class="switch">
<button id="btn-test" class="active" onclick="setMode('testnet')">Testnet</button>
<button id="btn-main" onclick="setMode('mainnet')">Mainnet</button>
</div>
<div class="actions">
<button class="btn-top login" onclick="piLogin()">🔐 Login with Pi</button>
<a href="https://wa.me/27700000000?text=Hello Agri Market" target="_blank"><button class="btn-top wa">💬 WhatsApp</button></a>
</div>
</div>

<div class="grid" id="grid"></div>
<div class="footer">Scroll down for all 9 products • Pay with Pi • Delivery in Gauteng</div>

<div class="modal" id="modal"><div class="box">
<img id="m-img" src="" style="width:100%;height:160px;object-fit:cover;border-radius:10px">
<h3 id="m-name"></h3><div id="m-price" class="price"></div>
<input id="d-name" placeholder="Full Name *"><input id="d-phone" placeholder="Phone *">
<textarea id="d-address" rows="3" placeholder="Delivery Address - Farm, City *"></textarea>
<button class="btn" onclick="confirmPay()">✅ Pay with Pi (Test)</button>
<button class="btn" style="background:#999" onclick="closeModal()">Cancel</button>
<small>Testnet uses small amount 0.01 Pi for testing to avoid Payment Failed</small>
</div></div>

<script>
let piUser=null,currentMode='testnet',currentProduct=null;
Pi.init({version:"2.0",sandbox:true});
function setMode(m){currentMode=m;document.getElementById('btn-test').classList.toggle('active',m==='testnet');document.getElementById('btn-main').classList.toggle('active',m==='mainnet');Pi.init({version:"2.0",sandbox:m==='testnet'});piUser=null;document.getElementById('user').innerText="Switched to "+m+" - Login again";}
function piLogin(){if(typeof Pi==="undefined"){alert("Open in Pi Browser!");return;}Pi.authenticate(['username','payments'],()=>{}).then(a=>{piUser=a.user;document.getElementById('user').innerText="✅ "+a.user.username+" ("+currentMode+")";}).catch(e=>alert("Login failed: "+e.message));}

const products=[
{name:"KUBOTA DSM-W PRO 6000",price:0.01,realPrice:1250,image:"./IMG-20260916-WA0169.jpg",desc:"6000L Spreader"},
{name:"JD X9 1100 Combine",price:0.02,realPrice:8900,image:"./IMG-20260916-WA3079.jpg",desc:"45ft Header"},
{name:"JD 4120R Sprayer",price:0.01,realPrice:4200,image:"./IMG-20260916-WA2077.jpg",desc:"120ft Boom"},
{name:"CLAAS LEXION 8700",price:0.01,realPrice:185,image:"./IMG-20260920-WA7092.jpg",desc:"Combine Harvester"},
{name:"CASE IH 4540 Floater",price:0.01,realPrice:145,image:"./IMG-20260920-WA5226.jpg",desc:"Sprayer"},
{name:"JD 8R 410 + Disc",price:0.01,realPrice:125,image:"./IMG-20260920-WA3637.jpg",desc:"Tractor System"},
{name:"JD 8R Tillage",price:0.01,realPrice:115,image:"./IMG-20260917-WA4818.jpg",desc:"Tillage"},
{name:"JD DB120 Planter",price:0.01,realPrice:135,image:"./IMG-20260920-WA4385.jpg",desc:"48-Row Planter"},
{name:"Kubota XTA Sprayer",price:0.01,realPrice:68,image:"./IMG-20260920-WA1709.jpg",desc:"Trailed Sprayer"}
];
const grid=document.getElementById('grid');
products.forEach(p=>{
 grid.innerHTML+=`<div class="card"><img src="${p.image}" onerror="this.src='https://via.placeholder.com/300x200?text=${p.name}'"><div class="body"><b style="font-size:12px">${p.name}</b><small>${p.desc}</small><div class="price">π ${p.realPrice} <small style="color:#999">test: ${p.price}</small></div><button class="btn" onclick="openModal('${p.name}',${p.price},'${p.image}',${p.realPrice})">Buy with Pi</button></div></div>`;
});
function openModal(n,p,i,r){if(!piUser){piLogin();return;}currentProduct={name:n,price:p,realPrice:r,img:i};document.getElementById('m-name').innerText=n+" (Real π "+r+")";document.getElementById('m-price').innerText="Test Pay: π "+p;document.getElementById('m-img').src=i;document.getElementById('modal').style.display='flex';}
function closeModal(){document.getElementById('modal').style.display='none';}
function confirmPay(){
 const name=document.getElementById('d-name').value,phone=document.getElementById('d-phone').value,addr=document.getElementById('d-address').value;
 if(!name||!phone||!addr){alert("Fill all fields");return;}
 closeModal();
 Pi.createPayment({amount:currentProduct.price,memo:currentProduct.name+" Delivery: "+addr,metadata:{name:name,phone:phone,address:addr,realPrice:currentProduct.realPrice}},{
   onReadyForServerApproval:function(id){console.log("Approve:",id);},
   onReadyForServerCompletion:function(id,txid){
     alert("✅ SUCCESS!\n"+currentProduct.name+"\nReal Price: π "+currentProduct.realPrice+"\nTest Paid: π "+currentProduct.price+"\nTx: "+txid+"\nDelivery: "+addr);
     window.open("https://wa.me/27700000000?text=ORDER: "+encodeURIComponent(currentProduct.name)+" Real Pi "+currentProduct.realPrice+" Test Pi "+currentProduct.price+"%0AName: "+encodeURIComponent(name)+"%0APhone: "+encodeURIComponent(phone)+"%0AAddr: "+encodeURIComponent(addr)," _blank");
   },
   onCancel:function(){alert("Cancelled");},
   onError:function(e){alert("Payment Error: "+(e.message||JSON.stringify(e))+"\nTry smaller amount or switch Testnet");console.log(e);}
 });
}
</script>
</body>
</html>
