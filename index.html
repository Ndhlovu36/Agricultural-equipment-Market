<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agri Equipment Market</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<style>
body{margin:0;font-family:Arial;background:#f1f5eb;padding-bottom:80px}
.header{background:#2e7d32;color:#fff;padding:14px;text-align:center;position:sticky;top:0;z-index:1000}
.switch{display:flex;justify-content:center;gap:10px;margin:8px 0}
.switch button{padding:7px 18px;border-radius:20px;border:2px solid #fff;font-weight:bold;cursor:pointer}
.active{background:#fff;color:#2e7d32} .inactive{background:transparent;color:#fff}
.top-btn{padding:9px 14px;border:none;border-radius:10px;font-weight:bold;margin:4px}
.grid{padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.card img{width:100%;height:135px;object-fit:cover;background:#e8e8e8}
.info{padding:8px}
.name{font-size:11px;font-weight:bold;height:34px;overflow:hidden;line-height:1.2}
.price{color:#2e7d32;font-weight:bold;font-size:14px}
.btn-buy{width:100%;padding:9px;background:#2e7d32;color:#fff;border:none;border-radius:9px;font-weight:bold;margin-top:4px}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:2000;justify-content:center;align-items:center;padding:12px}
.box{background:#fff;width:100%;max-width:360px;border-radius:14px;padding:16px}
.box input,.box textarea{width:100%;padding:10px;margin:5px 0;border:1px solid #ccc;border-radius:8px}
</style>
</head>
<body>
<div class="header">
<h2>🚜 Agri Equipment - 24 MACHINES</h2>
<div class="switch">
<button id="btn-test" class="active" onclick="setMode('testnet')">Testnet</button>
<button id="btn-main" class="inactive" onclick="setMode('mainnet')">Mainnet</button>
</div>
<div>
<a href="https://wa.me/27700000000" target="_blank"><button class="top-btn" style="background:#25D366;color:#fff">WhatsApp</button></a>
</div>
</div>

<div class="grid" id="grid"></div>

<div class="modal" id="modal"><div class="box">
<img id="m-img" src="" style="width:100%;height:150px;object-fit:cover;border-radius:10px">
<h3 id="m-name" style="font-size:14px;margin:6px 0"></h3>
<div id="m-price" style="color:#2e7d32;font-weight:bold"></div>
<input id="d-name" placeholder="Full Name *">
<input id="d-phone" placeholder="Phone *">
<textarea id="d-address" rows="2" placeholder="Delivery Address *"></textarea>
<button class="btn-buy" onclick="confirmPay()">✅ Pay with Pi</button>
<button class="btn-buy" style="background:#888" onclick="closeModal()">Cancel</button>
</div></div>

<script>
let currentMode='testnet', currentProduct=null;
try{ Pi.init({version:"2.0",sandbox:true}); }catch(e){}

function setMode(m){
 currentMode=m;
 document.getElementById('btn-test').className = m==='testnet' ? 'active' : 'inactive';
 document.getElementById('btn-main').className = m==='mainnet' ? 'active' : 'inactive';
 try{ Pi.init({version:"2.0",sandbox:m==='testnet'}); }catch(e){}
}

const products=[
{name:"KUBOTA PRO 6000 Sprayer",price:2.5,image:"IMG-20260916-WA0169.jpg"},
{name:"JD X9 1100 Combine",price:8.9,image:"IMG-20260916-WA3079.jpg"},
{name:"JD 4120R Sprayer 120ft",price:4.2,image:"IMG-20260916-WA2077.jpg"},
{name:"CLAAS LEXION 8700",price:6.5,image:"IMG-20260920-WA7092.jpg"},
{name:"CASE 4540 Floater",price:3.8,image:"IMG-20260920-WA5226.jpg"},
{name:"JD 8R 410 + Disc",price:3.2,image:"IMG-20260920-WA3637.jpg"},
{name:"JD 8R Tillage",price:2.8,image:"IMG-20260917-WA4818.jpg"},
{name:"JD DB120 Planter",price:3.5,image:"IMG-20260920-WA4385.jpg"},
{name:"Kubota XTA Sprayer",price:1.8,image:"IMG-20260920-WA1709.jpg"},
{name:"JD 9RX 640 640HP",price:12,image:"IMG-20260921-WA4395.jpg"},
{name:"New Holland CR11 775HP",price:11,image:"IMG-20260921-WA0033.jpg"},
{name:"Fendt 1050 Vario 517HP",price:9.5,image:"IMG-20260921-WA1772.jpg"},
{name:"CAT Challenger MT875",price:8.5,image:"IMG-20260921-WA0256.jpg"},
{name:"Case IH Quadtrac 715 715HP",price:12,image:"IMG-20260921-WA2164.jpg"},
{name:"JD S780 Combine 471HP",price:7.5,image:"IMG-20260921-WA9268.jpg"},
{name:"Fendt IDEAL 10T 790HP",price:10.5,image:"IMG-20260921-WA6086.jpg"},
{name:"Case IH Magnum 400 AFS",price:6.2,image:"IMG-20260921-WA2395.jpg"},
{name:"New Holland T9.700 SmartTrax",price:11.5,image:"IMG-20260921-WA5915.jpg"},
{name:"Kubota M8-20 210HP",price:2.2,image:"IMG-20260921-WA2428.jpg"},
{name:"CLAAS Axion 960 Terra Trac",price:5.8,image:"IMG-20260921-WA2479.jpg"},
{name:"Fruit Harvester Apple Orchard",price:5.2,image:"IMG-20260921-WA2479.jpg"},
{name:"Fertilizer Kuhn Axis Spreader",price:2.1,image:"IMG-20260921-WA5882.jpg"},
{name:"Fertilizer Spreader Amazone",price:3.4,image:"IMG-20260921-WA4183.jpg"},
{name:"Fertilizer Kverneland Exacta",price:2.8,image:"IMG-20260921-WA2400.jpg"}
];

let html="";
products.forEach(p=>{
 html+=`<div class="card">
 <img src="./${p.image}" onerror="this.src='https://picsum.photos/seed/${p.image}/400/300'">
 <div class="info"><div class="name">${p.name}</div><div class="price">π ${p.price}</div>
 <button class="btn-buy" onclick="openModal('${p.name.replace(/'/g,"")}','${p.price}','${p.image}')">Buy with Pi</button></div></div>`;
});
document.getElementById('grid').innerHTML=html;

function openModal(n,p,i){
 currentProduct={name:n,price:p,img:i};
 document.getElementById('m-name').innerText=n;
 document.getElementById('m-price').innerText="Price: π "+p+" ("+currentMode+")";
 document.getElementById('m-img').src="./"+i;
 document.getElementById('m-img').onerror=function(){ this.src='https://picsum.photos/seed/'+i+'/400/300'; };
 document.getElementById('modal').style.display='flex';
}
function closeModal(){ document.getElementById('modal').style.display='none'; }
function confirmPay(){
 const name=document.getElementById('d-name').value.trim();
 const phone=document.getElementById('d-phone').value.trim();
 const addr=document.getElementById('d-address').value.trim();
 if(!name||!phone||!addr){ alert("Fill all fields"); return; }
 closeModal();
 try{
  Pi.authenticate(['username','payments'],()=>{}).then(()=> {
    Pi.createPayment({amount:Number(currentProduct.price),memo:currentProduct.name,metadata:{product:currentProduct.name,buyer:name,phone:phone,address:addr,mode:currentMode}},{
     onReadyForServerApproval: async (pid)=>{ try{ await fetch('/api/approve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paymentId:pid})}); }catch(e){} },
     onReadyForServerCompletion: async (pid,txid)=>{ try{ await fetch('/api/complete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paymentId:pid,txid})}); }catch(e){} alert("✅ PAID π "+currentProduct.price); window.open("https://wa.me/27700000000?text=PAID "+encodeURIComponent(currentProduct.name)); },
     onCancel:()=>alert("Cancelled"),
     onError:(e)=>alert("Error: "+(e.message||JSON.stringify(e)))
    });
  }).catch(e=>alert("Pi auth failed - open in Pi Browser"));
 }catch(e){ alert("Open this site in Pi Browser to pay with Pi"); }
}
</script>
</body>
</html>
