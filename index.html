<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agri Equipment Market - Pi</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<style>
body{margin:0;font-family:Arial;background:#f1f5eb}
.header{background:#2e7d32;color:#fff;padding:14px;text-align:center;position:sticky;top:0;z-index:999}
.switch{display:flex;justify-content:center;gap:10px;margin:10px 0}
.switch button{padding:8px 18px;border-radius:20px;border:2px solid #fff;background:transparent;color:#fff;font-weight:bold}
.switch button.active{background:#fff;color:#2e7d32}
.actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.btn-top{padding:10px 16px;border-radius:10px;border:none;font-weight:bold}
.login{background:#ff9800;color:#fff}
.wa{background:#25D366;color:#fff}
.grid{padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.12)}
.card img{width:100%;height:165px;object-fit:cover;background:#fff}
.body{padding:10px}
.price{color:#2e7d32;font-weight:bold;font-size:16px}
.btn{width:100%;padding:11px;background:#2e7d32;color:#fff;border:none;border-radius:10px;margin-top:6px;font-weight:bold}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.7);z-index:9999;justify-content:center;align-items:center;padding:12px;box-sizing:border-box}
.box{background:#fff;width:100%;max-width:380px;border-radius:16px;padding:18px}
.box input,.box textarea{width:100%;padding:11px;margin:6px 0;border-radius:9px;border:1px solid #ccc;box-sizing:border-box}
</style>
</head>
<body>
<div class="header">
<h2 style="margin:0">🚜 Agri Market - Pi</h2>
<div id="user" style="margin:6px 0;font-weight:bold">❌ Not logged in</div>
<div class="switch">
<button id="btn-test" class="active" onclick="setMode('testnet')">Testnet</button>
<button id="btn-main" onclick="setMode('mainnet')">Mainnet</button>
</div>
<div class="actions">
<button class="btn-top login" onclick="piLogin()">🔐 Login with Pi</button>
<a href="https://wa.me/27700000000?text=Hello Agri Market - I want equipment" target="_blank"><button class="btn-top wa">💬 WhatsApp</button></a>
</div>
<small>Real Equipment • Delivery Available</small>
</div>

<div class="grid" id="grid"></div>

<div class="modal" id="modal">
<div class="box">
<img id="m-img" src="" style="width:100%;height:160px;object-fit:cover;border-radius:10px">
<h3 id="m-name" style="margin:8px 0"></h3>
<div id="m-price" class="price"></div>
<input id="d-name" placeholder="Full Name *">
<input id="d-phone" placeholder="Phone / WhatsApp *">
<textarea id="d-address" rows="3" placeholder="Delivery Address - Farm Location *"></textarea>
<button class="btn" onclick="confirmPay()">✅ Pay with Pi</button>
<button class="btn" style="background:#999" onclick="closeModal()">Cancel</button>
</div>
</div>

<script>
let piUser=null,currentMode='testnet',currentProduct=null;
Pi.init({version:"2.0", sandbox:true});

function setMode(m){
 currentMode=m;
 document.getElementById('btn-test').classList.toggle('active',m==='testnet');
 document.getElementById('btn-main').classList.toggle('active',m==='mainnet');
 Pi.init({version:"2.0", sandbox:(m==='testnet')});
 document.getElementById('user').innerText="Switched to "+m+" - Please Login again";
 piUser=null;
}
function piLogin(){
 Pi.authenticate(['username','payments'], function(p){}).then(function(auth){
   piUser=auth.user;
   document.getElementById('user').innerText="✅ "+auth.user.username+" ("+currentMode+")";
 }).catch(function(e){ alert("Login failed: Open in Pi Browser"); });
}

const products=[
{name:"KUBOTA DSM-W PRO 6000",price:0.5,image:"./IMG-20260916-WA0169.jpg",desc:"6000L Spreader"},
{name:"JD X9 Combine",price:1.2,image:"./IMG-20260916-WA3079.jpg",desc:"Harvester"},
{name:"JD 4120R Sprayer",price:0.8,image:"./IMG-20260916-WA2077.jpg",desc:"120ft Boom"},
{name:"CLAAS LEXION 8700",price:0.9,image:"./IMG-20260920-WA7092.jpg",desc:"Combine"},
{name:"CASE 4540",price:0.7,image:"./IMG-20260920-WA5226.jpg",desc:"Floater"},
{name:"JD 8R 410 + Disc",price:0.6,image:"./IMG-20260920-WA3637.jpg",desc:"Tractor"}
];

const grid=document.getElementById('grid');
products.forEach(p=>{
 grid.innerHTML+=`<div class="card"><img src="${p.image}"><div class="body"><b style="font-size:12px">${p.name}</b><br><small>${p.desc}</small><div class="price">π ${p.price}</div><button class="btn" onclick="openModal('${p.name}',${p.price},'${p.image}')">Buy with Pi</button></div></div>`;
});

function openModal(n,p,i){
 if(!piUser){ piLogin(); return; }
 currentProduct={name:n,price:p,img:i};
 document.getElementById('m-name').innerText=n;
 document.getElementById('m-price').innerText="π "+p;
 document.getElementById('m-img').src=i;
 document.getElementById('modal').style.display='flex';
}
function closeModal(){ document.getElementById('modal').style.display='none'; }

function confirmPay(){
 const name=document.getElementById('d-name').value;
 const phone=document.getElementById('d-phone').value;
 const addr=document.getElementById('d-address').value;
 if(!name||!phone||!addr){ alert("Fill Name, Phone, Address"); return; }
 closeModal();

 // FIXED PAYMENT - No more 'data' error
 Pi.createPayment({
   amount: parseFloat(currentProduct.price),
   memo: currentProduct.name + " - Delivery to " + addr,
   metadata: {product:currentProduct.name, address:addr, phone:phone, name:name}
 }, {
   onReadyForServerApproval: function(paymentId){
     console.log("Approval:", paymentId);
     // For testnet we just log - no server call that crashes
   },
   onReadyForServerCompletion: function(paymentId, txid){
     alert("✅ Payment Success!\n"+currentProduct.name+"\nTxID: "+txid+"\nDelivery: "+addr);
     window.open("https://wa.me/27700000000?text=NEW ORDER: "+encodeURIComponent(currentProduct.name)+" %0A Pi "+currentProduct.price+" %0A Name: "+encodeURIComponent(name)+" %0A Phone: "+encodeURIComponent(phone)+" %0A Address: "+encodeURIComponent(addr), "_blank");
   },
   onCancel: function(paymentId){ alert("Payment Cancelled"); },
   onError: function(error, payment){
     alert("Payment Error: " + error.message);
     console.log(error);
   }
 });
}
</script>
</body>
</html>
