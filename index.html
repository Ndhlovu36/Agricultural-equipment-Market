<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agri Equipment Market - Pi</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<style>
body{font-family:Arial;margin:0;background:#eef2e6}
.header{background:#2e7d32;color:white;padding:18px;text-align:center;position:sticky;top:0;z-index:10}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}
.card{background:white;border-radius:14px;overflow:hidden;box-shadow:0 3px 10px rgba(0,0,0,.12)}
.card img{width:100%;height:155px;object-fit:cover;background:#fff}
.body{padding:10px}
.body h3{margin:0 0 4px;font-size:13px;line-height:1.2;height:32px;overflow:hidden}
.price{color:#2e7d32;font-weight:bold;font-size:15px}
.btn{width:100%;background:#2e7d32;color:white;border:none;padding:10px;border-radius:8px;margin-top:8px;font-weight:bold}
</style>
</head>
<body>
<div class="header"><h2 style="margin:0">🚜 Agri Market - Pi Network</h2><small>Authentic Equipment • Pay with Pi</small></div>
<div class="grid" id="grid"></div>
<script>
Pi.init({version:"2.0", sandbox:false});
const products=[
{name:"CLAAS LEXION 8700 Combine Harvester",price:185,image:"/IMG-20260920-WA7092.jpg"},
{name:"CASE IH 4540 Floating Sprayer",price:145,image:"/IMG-20260920-WA5226.jpg"},
{name:"John Deere 8R 410 Tractor + Disc Harrow",price:125,image:"/IMG-20260920-WA3637.jpg"},
{name:"John Deere 8R Tillage System",price:115,image:"/IMG-20260917-WA4818.jpg"},
{name:"John Deere DB120 48-Row Planter",price:135,image:"/IMG-20260920-WA4385.jpg"},
{name:"Kubota XTA 3324 Trailed Sprayer",price:68,image:"/IMG-20260920-WA1709.jpg"},
{name:"John Deere 8R Field Cultivator",price:110,image:"/IMG-20260917-WA0911.jpg"},
{name:"Kinze 3605 Twin-Row Planter",price:98,image:"/IMG-20260916-WA6299.jpg"},
{name:"John Deere 8R 340 + 3140 Disc",price:105,image:"/IMG-20260916-WA3970.jpg"}
];
const grid=document.getElementById('grid');
products.forEach(p=>{
grid.innerHTML+=`<div class="card"><img src="${p.image}"><div class="body"><h3>${p.name}</h3><div class="price">Pi ${p.price}</div><button class="btn" onclick="buy('${p.name.replace(/'/g,'')}',${p.price})">Buy with Pi</button></div></div>`;
});
function buy(name,price){
if(typeof Pi==='undefined'){alert('Open in Pi Browser');return;}
Pi.createPayment({amount:price,memo:name,metadata:{product:name}},{
onReadyForServerApproval:id=>fetch('/api/approve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paymentId:id})}).then(r=>r.json()),
onReadyForServerCompletion:(id,txid)=>fetch('/api/complete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paymentId:id,txid})}).then(()=>alert('Paid: '+name)),
onCancel:()=>alert('Cancelled'),onError:(e)=>alert('Error: '+e)
});
}
</script>
</body>
</html>
